name: Rust core tests and lint

# The full suite needs CalculiX, OpenFAST, ccblade and precice, which are not on a
# stock runner (see .github/workflows/makefile.yml for the heavyweight stack build).
# This job covers the self-contained part of the validation: the pure-Rust core
# (nalgebra + rayon only) whose element/assembly tests hold the K_G, MITC and
# geometric-stiffness invariants, plus the Python lint that the suite is written to
# pass.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  rust-core:
    name: cargo test (aeroelast-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --manifest-path crates/Cargo.toml -p aeroelast-core

  python-lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.0
      - run: ruff check tests src
