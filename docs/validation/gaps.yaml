  - id: force_projection_sense_p5
    scope: BEM to mesh load frame and sense (ForceProjector, defect P5)
    status: open_defect
    reason: >-
      The frame and the sense are fixed and pinned; what remains open is the
      prohibition, not the work: every campaign number produced BEFORE these
      fixes had its aerodynamic load pushing upwind and braking the rotor, so
      those numbers carry the wrong sign and cannot be reused. The convention is
      arbitrated once, against the deck itself, by
      `tools/diagnose_sign_chain.py` (every real station ring matched to its
      WindIO aerofoil, residual 0.5-3.6% of chord): the deck puts the leading
      edge at positive x and the load-frame downwind (thrust) direction at
      positive y, so a rigid +z rotation moves the leading edge downwind and
      NOSE-DOWN is `omega > 0`. `ForceProjector` records the per-strip
      `_strip_moment_axis_sign` and applies the aerodynamic pitching moment on
      it, because the deck's leading-to-trailing direction runs against
      `_strip_chord_dirs` at every real station (`LE . c_hat = -1.0`); the old
      guards asserted the inverted `omega < 0` and let the wrong-axis moment
      pass.
    evidence: >-
      Frame: the load axis comes per strip from the section outline, guarded by
      `tests/validation/bem/test_force_projection_load_frame.py`: worst
      `|F.c_hat|/|F| = 0.0116` and `|F.f_hat|/|F| = 0.9999` for `Np` (the same
      pair for `Tp`), worst `angle(F, f_hat) = 0.662 deg`, uniform-`Np`
      conservation `0.74%`, against bounds 5% / 5% / 10 deg / 5%. The moment
      check builds its per-strip frame from the ring outline and reproduces the
      applied moment to `1.76e-15` relative, bound 1%. Sense: with the
      production defaults the rated summed load points downwind
      (`F.y = +8.4444e5 N`, `|F| = 8.5263e5 N`), `1.30%` off `bem.thrust/3`
      against a 2% bound, and delivers `+5.256 MW` for `Omega = +0.7917 y`.
    consequence: >-
      The re-derivation this gap asked for has been done and is stored: the
      de-loading is measured in one sign convention by
      `tests/validation/blade/test_blade_deloading_vs_reference.py`, and the
      elastic tip twist is now `+8.1048 deg` nose-down at the tip (minimum-norm;
      `+9.6669 deg` with the with-properties multi-cell path), not the pre-fix
      `-1.5112 deg`. Corrected de-loading (thrust/power): twist only
      `-26.01% / -15.61%`, radii only `+1.24% / +0.95%`, production path
      `-25.31% / -14.77%`, against Zhou Table 6's `-13.04% / -8.38%`. What
      remains is the prohibition, not the work: numbers quoted from the pre-fix
      path are uncitable, and the few-percent power residual against the
      published rating is reported rather than tuned.
    citations_forbidden: true
    rows: []
  - id: force_projection_axial_extension
    scope: >-
      the linear structural solve on the prebent blade axis, not the load
      frame
    status: open_defect
    reason: >-
      The deformed blade measures LONGER along the span than the reference
      centroid path, and that growth re-loads the rotor. The cause first
      recorded here - the local spanwise force the nodal distribution injects -
      was measured and REFUTED (verdict 22.7): constraining the whole solve to
      the section plane makes `sum|fz| = 0` exactly and moves the displacement
      field by `max||du|| = 2.6e-3 m`, 0.016% of the 16.53 m response, with the
      axial tip displacement going `+1.0630 -> +1.0631 m`. The lengthening comes
      from the in-plane flapwise load acting on a curved (prebent) blade axis.
      Re-derived on 2026-10-06 through the production load path, the mechanism is
      sharper than "a linear solve cannot shorten": the axial shortening IS
      returned (`-1.209 m` at the tip against the `-1.149 m` inextensional theory
      predicts) and what grows is the *path measure*, by the second-order
      transverse term, 98.8% of it from the flapwise deflection gradient. The
      evidence block carries the decomposition. The solver
      named in the measurement is a static scipy replica in the diagnostic; the
      production rotor path is Rust/PETSc (`run_rotor_fsi_solver`), one linear
      KSP step per Newmark step. The mechanism is solver-independent, the
      magnitude below is not a production measurement.
    evidence: >-
      The deformed centroid path measures `119.1356 m` against a `117.2256 m`
      reference, `+1.629%`, with `sum fz = -3.5e-11 N` and `sum|fz| = 276,080 N`
      (24.99% of `sum|fy| = 1,104,872 N`), 99.16% of which is the AC lever-arm
      identity `M_bend = -dz_ac x (span x F)`, not torsion. Load split: the
      spanwise system alone gives `-0.0032 m` at the tip, the flapwise component
      alone `+1.0641 m`. Inextensional theory predicts about `-1.149 m` for a
      16.42 m flap over 117 m. The rebuild below reaches `-1.209 m`, so the linear
      solve does return the axial shortening; what the guard cannot assert is the
      *sign of the path measure*, which grows by the transverse term instead.
      Ring-centroid `y` runs `+0.36 m` at z = 24 m to `-4.00 m` at the tip, with
      about `0.9 m` of x curvature. The prebend/precurve split IS established
      (2026-10-06, re-derived because the diagnostic that produced these numbers
      is no longer in the tree: `grep -rn 119.1356` finds nothing). Per segment,
      with `dr` the reference chord and `du` the displacement difference,
      `|dr+du| - |dr| = (dr.du)/|dr| + (|du|^2 - proj^2)/(2|dr|) + O^3`: the axial
      projection term sums to `-0.0063 m`, its two parts cancelling (the prebend
      slope contributes `+1.2189 m`, the axial response `-1.2087 m`), and the
      transverse quadratic term to `+2.5547 m`, which is the whole artefact.
      Within that term the flapwise direction carries `+2.5221 m` (98.8%) against
      `+0.0164 m` for x and `+0.0162 m` for z. Counterfactuals on the measure:
      zeroing the x curvature leaves `+2.5665 m` (103.7%); zeroing the y curvature
      halves it to `+1.3171 m` (53.2%). The prebend carries the effect and the
      precurve carries essentially none. Reproducibility: the rebuild gets
      `L_ref = 117.2256 m` exactly and `L_def = 119.7010 m`, `+2.112%`, against the
      `+1.629%` above. The deleted replica read the flapwise sense inverted
      (`sum|fz| = 276,080 N` against `47,971 N`; flap-only tip axial `+1.0641 m`
      against `-1.2103 m`), which is what the load-frame fixes changed, and the
      decomposition is invariant under that flip (mirror case `+2.19%`). The
      `+1.629%` magnitude therefore belongs to the pre-fix path and is not
      citable.
    consequence: >-
      The radii feedback alone re-loads the rotor by `+1.24%` thrust and
      `+0.95%` power, so it offsets part of the twist-only de-loading
      (`-26.01% / -15.61%`), leaving the production path (twist + radii) at
      `-25.31% / -14.77%`. That offset is partly this artefact and not
      bend-twist. Numbers from the production path before the load-frame fixes
      stay non-citable. What is NOT owed any more is a load-frame fix: removing
      the spanwise force changes nothing measurable, so this gap is now a
      structural-model question about linear analysis on a curved axis. The
      twist/de-loading figures here are the corrected ones; the convention is
      arbitrated in `force_projection_sense_p5`.
    citations_forbidden: true
    rows: []

  - id: rotor_coupling_noncontraction
    scope: >-
      the implicit preCICE coupling (IQN-ILS) of the corotational rotor FSI
      path, whose contraction is what makes a coupled number mean anything
    status: open_defect
    reason: >-
      The implicit coupling of the corotational rotor path stopped contracting
      between the campaign of 2026-09-30 and HEAD. The campaign that produced
      the stored snapshots converged every one of its first 500 windows (mean
      4.1 sub-iterations, max 18); the same case at HEAD spends its first 20
      windows on the 30-iteration ceiling and converges 51 of 500 (10%). Both
      the pre-fix and the post-fix sign chain fail it, so the sign fixes are not
      the cause (`coupling-nonconvergence-sign-fixes-exonerated`); the regression
      dates from the 2026-10-04 merge of origin/main or from the #11 batch that
      follows it. The reading that this was the start-up transient was measured
      and is refuted: every A/B that supported it ran 10 windows (0.1 s), and the
      process that breaks needs ~1.9 s. One defect used to be mixed into this
      one and is now closed on its own: the mesh-rotation -> BEM-twist sense was
      derived from `tangential_direction` (the sense of the tangential FORCE),
      which every production case YAML sets to `-x`, so production ran a factor
      of `-1` that the static fixtures never saw. A rigid +2 deg nose-down
      section rotation measured +10.63% of thrust on that frame against -13.05%
      on the fixtures' frame, and it is what ran the coupled rotor away to
      1e14 m at t ~ 1.9 s. Fixed 2026-10-07 (the sense is measured from the
      leading edge now, guard P8). The runaway is gone; the non-contraction is
      not, and it is the second, independent defect this entry records.
    evidence: >-
      `$SCRATCH/frontiersin_results_corotational_100s/yaw_0` (2026-09-30,
      pre-merge, completed 100 s): 500 of its first 500 windows converged, mean
      4.1 sub-iterations, max 18, first 20 = 15 11 11 13 13 12 11 10 11 10 11 10
      11 9 9 8 6 8 7 6. `$SCRATCH/smoke_fix_results/twistfix_5s` (2026-10-07,
      HEAD with the twist sense fixed, `max-time 5.0`): 500 windows, 51
      converged (10%), mean 28.5, max 30, first 20 all at 30. The transient is
      still violent at HEAD: the tip displacement peaks at 2783 m at t = 3.0 s
      and thrust swings from -0.12 MN to +3.47 MN, against the campaign's
      settled 7.2-7.4 m. `$SCRATCH/smoke_fix_results/base_fix` (2026-10-07, HEAD
      before the twist fix) reads 328 of 500 "converged", which is an artefact of
      its own runaway: once the structure is at 1e14 m `||F|| = 0` and each
      window closes in 2 iterations. The two cases differ by one line of case
      configuration on the SOLID mesh (`airfoil_spacing: cosine` for the
      campaign, `constant` for the gate smoke); job 11610151 runs the campaign's
      own case at HEAD to separate that from the code.
    consequence: >-
      Every number that comes out of the coupled path is uncitable while this
      holds: the campaign relaunch (gate 1 of the 2026-10-05 gate list) cannot
      start, the stored snapshots cannot be re-anchored against a fresh
      baseline, and roadmap item 1 of issue #18 (#13, the axial artefact) cannot
      be closed the way its own issue says it must - by measuring it on the
      production outputs rather than on the static replica. The static one-way
      table stands: `-26.01% / -15.61%` twist-only, `+1.24% / +0.95%`
      radii-only, `-25.31% / -14.77%` production, and the fix of 2026-10-07 is
      what makes its "production path" label true for the first time.
    citations_forbidden: true
    rows: []
