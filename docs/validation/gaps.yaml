# What the suite does NOT validate.
#
# A gap is a claim about absence, so it cannot be derived from the rows:
# a row that does not exist cannot be queried. This file is therefore
# data, and `check` validates it, because it is the one part of the
# validation scheme whose loss would be silent — the numbers stay green
# and the caveat disappears.
#
# `citations_forbidden: true` means: do not cite a result here as
# validation evidence. A `not_validated` entry has no result to cite; an
# `open_defect` entry has one that must not be cited, and its
# `consequence` says what that invalidates.
version: 1

gaps:
  - id: composite_stress_recovery
    scope: "composite outer-fibre stress recovery"
    status: not_validated
    reason: >-
      `*SHELL SECTION, COMPOSITE` ignores `OUTPUT=3D`, so CalculiX cannot
      act as the independent stress judge it is for isotropic shells.
    evidence: >-
      Issue #3. The composite stiffness path is validated through the ABD
      matrices against an independent CLT, which is a different claim.
    consequence: >-
      A composite stress number has no independent reference in this
      suite. Only the ABD matrices may be cited, and only as a
      material-model verification.
    citations_forbidden: true
    rows: []

  - id: rotating_modal_shift
    scope: "rotating and centrifugal modal shift"
    status: not_validated
    reason: >-
      CLOSED AS A VALIDATION, OPEN AS A ROW (re-checked 2026-10-06): the
      rotating and centrifugal shift IS compared against an independent rotor
      source. `tests/test_iea15mw_s4_rotating_modal.py` asserts 1st flap, 1st
      edge and 2nd flap against the OpenFAST v5 MBC3 targets (assert rel <
      REL_TOL) at parked and at 7.56 rpm, plus that centrifugal stiffening
      raises the 1st flap from parked to rated; all three tests pass (re-run
      2026-10-06, green in 168 s). The file's own measured agreement of
      2026-09-09: rotating 1F +0.6%, 1E -4.5%, 2F -1.5%. What is missing is
      not the work but its record: the store has no row for it, so the numbers
      are still not citable. (Superseded text, kept for the record: "the
      rotating modes are compared against no independent rotor source
      anywhere in this suite".)
    evidence: >-
      tests/test_iea15mw_s4_rotating_modal.py, 3 passed on 2026-10-06 (parked
      vs OpenFAST, 7.56 rpm vs OpenFAST, centrifugal stiffening). Issue #7
      fixed the MITC4 K_G thickness bug that had made the claim rest on the
      implementation. No row in the store asserts a rotating frequency yet:
      registering the test as a group and extracting its rows is the remaining
      step.
    consequence: >-
