  - id: moment_realization_over_delivers
    scope: "activating the multi-cell wall-flow realisation in production"
    status: not_validated
    reason: >-
      The realisation defect this entry used to describe is closed. The
      minimum-norm field `f_j = omega x d_j` over-delivered rigid torsion where
      a closed section carries the wall shear flow, and commit `1146265`,
      arbitrated against the deck's own aerofoil geometry by
      `tools/diagnose_sign_chain.py`, fixed the linked sign errors and the
      multi-cell realisation now carries the physical field: the skin carries
      `q_i`, a shared web carries `q_i - q_j`, the total moment is exact and the
      net force is zero. It is pinned for the single-cell tube (0.3091% against
      Bredt) and for the multi-cell cells against an independent hand-assembled
      Bredt-Batho system. What is NOT validated is its activation in production:
      `BEMFSIParticipant` builds its projectors without `element_properties` on
      the fluid side, so the blade's strips still route through `_distribute`
      (the sign-correct but single-cell minimum-norm field), and the multi-cell
      reference is our own hand assembly, not an external code or a published
      value.
    evidence: >-
      tests/test_multicell_shear_flow.py: an asymmetric two-cell box reproduces
      the independently hand-assembled `(n+1)` Bredt-Batho system, the shared
      web reads back `q_i - q_j`, the realised moment is exact and the net force
      is zero, and the minimum-norm and with-properties realisations of the same
      rated moment agree in sign (both nose-down, `+8.1048` against `+9.6669`
      deg; the pre-fix `-0.8696` / `+0.0773` deg inverted because the pitching
      moment rode the raw span axis - issue #11). The single-cell tube is
      tests/validation/parity/test_thin_walled_tube_moment_realization.py
      (group 31): the independent hand-written shear flow and the production
      path both land at rate/Bredt 1.0031 with `distortion/|rotation|` 0.008,
      against 31.6933 and 2.042 for the old minimum-norm field (verdict 22.9).
      The pre-fix departure was an end effect and decayed with length, so the
      31.69x was never a blade-scale statement. Two earlier claims stay
      withdrawn: the `0.74x` / `1.35x` torsional deficit of 1df95fe was a
      reference mix-up and became a 9% residual once `GJ_static/GJ_deck = 1.068`
      was measured (verdict 22.10), and the deficit's remaining 2.4x against
      Zhou's tip torsion is an aero/torque difference, not a stiffness or
      load-frame one (verdict 22.11: their 4.072 Hz first torsion matches our
      4.000 Hz to 1.8%).
    consequence: >-
      A production blade torsional-load number still rides the minimum-norm
      field, which is sign-correct but not the multi-cell wall flow, so it may
      not be cited as the multi-cell realisation. Enabling the realisation needs
      the laminate map on the fluid side, and the multi-cell flow needs an
      external reference before it can be called independently validated.
      Pre-fix numbers remain uncitable: before `1146265` the requested section
      torque was nose-up (`+4.839888e5 N.m`).
    citations_forbidden: true
    rows: []
