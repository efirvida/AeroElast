  - id: moment_realization_over_delivers
    scope: >-
      the wall-flow moment realisation in production, and the multi-cell split
      it cannot reach
    status: bounded
    reason: >-
      Implemented, guarded and measured on 2026-10-09 (issue #16, roadmap item
      P2 of #18), but **off by default**: the coupling path delivers the deck's
      section-property map only when a case sets
      `bem.wall_flow_realisation: true`, because the coupled consequence
      measured that same day is a first-order change that nothing attributes yet
      - parked under its own follow-up issue rather than left riding every
      campaign. The minimum-norm field
      `f_j = omega x d_j` over-delivered rigid torsion
      where a closed section carries the wall shear flow, and commit `1146265`
      fixed the linked sign errors. The blocker was never the realisation but
      the coupling mesh: `_build_mesh` filtered the blade mesh to the
      `allOuterShellNods` node set with `MeshModel(nodes=...)` and dropped every
      element, so `ring_section` found no chordwise wall edge and every strip
      took `_distribute` (0 of 671 ring sections usable at
      `element_size: 0.25`).
      The CLI now keeps the fully contained elements
      (`MeshModel.subset_to_nodes`) and builds the projector's property map from
      the same generator (`_element_properties_for`), so one config key turns
      the wall shear flow on: 671 of 671 ring sections realisable, every wall's
      `S = G*t` resolved from the deck's laminates, 100 % property coverage of
      the coupling elements. Measured cell counts: on the campaign mesh
      (`element_size: 0.25`) every one of the 671 rings bounds **one** closed
      cell, so the production campaign runs the single-cell half; on the tests'
      coarse mesh (`element_size: 1.0`) the *same* coupling node set closes 1, 2
      or 3 cells (94/4/88 of 186), so the `q_i - q_j` shared-wall walk does run
      there and those tests are not vacuous - but its only evidence remains our
      own hand-assembled Bredt-Batho system, not an external code or a published
      value. **A coupling mesh whose element sets do not match the deck's
      section-set names keeps the fallback**: a `RotorMesh` coupling mesh
      carries `<set>_blade_N`, so the map is withheld by design and the strips
      route through `_distribute` again.
    evidence: >-
      Activation, tests/validation/bem/test_wall_flow_activation.py (group 37):
      the production coupling mesh keeps 27598 of the full mesh's 33462
      elements and 2828 of 32325 nodes at the test's coarse size, 671 of 671
      ring sections are realisable at `element_size: 0.25` (0 of 671 before),
      every one of them single-cell, and the wall-flow split leaves the applied
      resultant exactly where the minimum-norm field had it - relative
      `|dF| = 1.403e-16`, `|dM| = 5.984e-16` - while the distribution moves
      (relative L2 92.22 %, max |df| 5063.666 N, 2828 of 2828 nodes), and the
      property-less projector is bit-equal to the pre-#16 node-only one.
      The *coupled* consequence, measured 2026-10-09 on the gate case at
      `max-time 5.0` (A = the `bd8237d` fluid, B = this tree, same solid tree;
      jobs `$SCRATCH/bfs16/run_ab.srm`, comparison `compare_ab.py` and
      `field_ab.py`): thrust -0.232 %, torque/power -0.547 %, edgewise tip
      disp -8.866 %, flapwise tip disp +0.179 %, max nodal force +13.610 %,
      `TOP`/`MID`/`BOT` von Mises -23.948 %/-27.867 %/+17.029 %, applied aero
      force L2 +39.9 %, and the tip section rotation **+2.583 -> -27.404 deg**
      (`ROTZ`; best-fit +1.208 -> -9.270 deg), a *distributed* difference
      growing from ~0 at the root to ~-10 deg at the tip. Attributed on
      2026-10-10 (issue #30, closure section in validation_closures.md). The
      applied pattern carries **no sign flip**: at an identical per-strip
      resultant the two frozen `F_AERO` fields differ by 133.4 % of L2 while
      the cumulative applied twist moment is `+9.4 %`, same sign, and the
      movement is the *structural response to the pattern* - with each run's
      own frozen field on the production mesh, statically, with no dynamics and
      no aero feedback, the wall-flow section rotation is 2-3.3x the
      minimum-norm one over the outer span (median 1.98 affine / 3.31 rigid in
      `z in [93.6, 112.3] m`, against a `+4.5 %` applied torque), and the
      coupled 2.6x lies inside that range. The raw `ROTZ` flip that opened the
      issue is a **nodal** DOF - the drilling the tangential pattern excites
      4-10x more - not a section rotation, and the raw `ROTZ`/best-fit numbers
      are estimator-dependent at a 16-node tip ring whose deformed centroid
      sits ~24 m from the reference one. On the torsion path the arbiter did
      not tie: the wall flow is Bredt on the deck's own airfoil ring (0.95943,
      distortion 4.1e-6) while the minimum-norm field over-delivers (1.65658
      and rising there; 31.69331 on the validated rectangle, now pinned in
      `test_thin_walled_tube_moment_realization.py`, and +330-338 % of the
      exact Bredt strain energy in the *distributed* application mode
      production actually runs, an excess that does not move under mesh
      refinement while the wall flow's own +4.36 % -> +1.56 % does).
      Independent evidence for the realisation itself, unchanged: the
      single-cell tube is group 31 (rate/Bredt 1.0031 with
      `distortion/|rotation|` 0.008, against 31.6933 and 2.042 for the old
      minimum-norm field), and `tests/test_multicell_shear_flow.py` reproduces
      an independently hand-assembled `(n+1)` Bredt-Batho system on an
      asymmetric two-cell box where the shared web reads back `q_i - q_j`.
      Two earlier claims stay withdrawn: the `0.74x` / `1.35x` torsional
      deficit of 1df95fe was a reference mix-up and became a 9% residual once
      `GJ_static/GJ_deck = 1.068` was measured (verdict 22.10), and the
      deficit's remaining 2.4x against Zhou's tip torsion is an aero/torque
      difference, not a stiffness or load-frame one (verdict 22.11: their
      4.072 Hz first torsion matches our 4.000 Hz to 1.8%).
    consequence: >-
      The wall-flow moment realisation exists, is guarded by group 37 and
      reaches the projector on both production entry points, but it is **off
      by default** (`bem.wall_flow_realisation: false`), so every production and
      campaign number today rides the minimum-norm field and the old baseline
      still stands. Turning it on is not a refinement: at an identical per-strip
      resultant the coupled tip section rotation moves from +2.58 to -27.40 deg
      and the peak stresses by tens of percent, with the flapwise deflection
      essentially unchanged. The movement is attributed (issue #30,
      2026-10-10) as a structural response to the pattern rather than a load or
      transfer effect, so it is not an artefact to discount - but it is a real
      change of state: a case that activates it must say so in its own
      results,
      must not be compared with a minimum-norm run as if it were the same state,
      and may not call its twist validated. The multi-cell flow itself may still
      not be cited as a production result, and a rotor-suffixed coupling mesh
      keeps the minimum-norm fallback. Pre-fix numbers remain uncitable: before
      `1146265` the requested section torque was nose-up (`+4.839888e5 N.m`).
    citations_forbidden: true
