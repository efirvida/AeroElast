# What the suite does NOT validate.
#
# A gap is a claim about absence, so it cannot be derived from the rows:
# a row that does not exist cannot be queried. This file is therefore
# data, and `check` validates it, because it is the one part of the
# validation scheme whose loss would be silent — the numbers stay green
# and the caveat disappears.
#
# `citations_forbidden: true` means: do not cite a result here as
# validation evidence. A `not_validated` entry has no result to cite; an
# `open_defect` entry has one that must not be cited, and its
# `consequence` says what that invalidates.
version: 1

gaps:
  - id: composite_stress_recovery
    scope: "composite outer-fibre stress recovery"
    status: not_validated
    reason: >-
      `*SHELL SECTION, COMPOSITE` ignores `OUTPUT=3D`, so CalculiX cannot
      act as the independent stress judge it is for isotropic shells.
    evidence: >-
      Issue #3. The composite stiffness path is validated through the ABD
      matrices against an independent CLT, which is a different claim.
    consequence: >-
      A composite stress number has no independent reference in this
      suite. Only the ABD matrices may be cited, and only as a
      material-model verification.
    citations_forbidden: true
    rows: []

  - id: rotating_modal_shift
    scope: "rotating and centrifugal modal shift"
    status: not_validated
    reason: >-
      The MITC4 `K_G` thickness bug was fixed (issue #7), but the rotating
      modes are compared against no independent rotor source anywhere in
      this suite.
    evidence: >-
      Issue #7 for the fix; no row asserts a rotating frequency against an
      independent source.
    consequence: >-
      A centrifugal-stiffening claim rests on the geometric stiffness
      implementation, not on a validation.
    citations_forbidden: true
    rows: []

  - id: moment_realization_over_delivers
    scope: "activating the multi-cell wall-flow realisation in production"
    status: not_validated
    reason: >-
      The realisation defect this entry used to describe is closed. The
      minimum-norm field `f_j = omega x d_j` over-delivered rigid torsion where
      a closed section carries the wall shear flow, and commit `1146265`,
      arbitrated against the deck's own aerofoil geometry by
      `tools/diagnose_sign_chain.py`, fixed the linked sign errors and the
      multi-cell realisation now carries the physical field: the skin carries
      `q_i`, a shared web carries `q_i - q_j`, the total moment is exact and the
      net force is zero. It is pinned for the single-cell tube (0.3091% against
      Bredt) and for the multi-cell cells against an independent hand-assembled
      Bredt-Batho system. What is NOT validated is its activation in production:
      `BEMFSIParticipant` builds its projectors without `element_properties` on
      the fluid side, so the blade's strips still route through `_distribute`
      (the sign-correct but single-cell minimum-norm field), and the multi-cell
      reference is our own hand assembly, not an external code or a published
      value.
    evidence: >-
      tests/test_multicell_shear_flow.py: an asymmetric two-cell box reproduces
      the independently hand-assembled `(n+1)` Bredt-Batho system, the shared
      web reads back `q_i - q_j`, the realised moment is exact and the net force
      is zero, and the minimum-norm and with-properties realisations of the same
      rated moment agree in sign (both nose-down, `+8.1048` against `+9.6669`
      deg; the pre-fix `-0.8696` / `+0.0773` deg inverted because the pitching
      moment rode the raw span axis - issue #11). The single-cell tube is
      tests/validation/parity/test_thin_walled_tube_moment_realization.py
      (group 31): the independent hand-written shear flow and the production
      path both land at rate/Bredt 1.0031 with `distortion/|rotation|` 0.008,
      against 31.6933 and 2.042 for the old minimum-norm field (verdict 22.9).
      The pre-fix departure was an end effect and decayed with length, so the
      31.69x was never a blade-scale statement. Two earlier claims stay
      withdrawn: the `0.74x` / `1.35x` torsional deficit of 1df95fe was a
      reference mix-up and became a 9% residual once `GJ_static/GJ_deck = 1.068`
      was measured (verdict 22.10), and the deficit's remaining 2.4x against
      Zhou's tip torsion is an aero/torque difference, not a stiffness or
      load-frame one (verdict 22.11: their 4.072 Hz first torsion matches our
      4.000 Hz to 1.8%).
    consequence: >-
      A production blade torsional-load number still rides the minimum-norm
      field, which is sign-correct but not the multi-cell wall flow, so it may
      not be cited as the multi-cell realisation. Enabling the realisation needs
      the laminate map on the fluid side, and the multi-cell flow needs an
      external reference before it can be called independently validated.
      Pre-fix numbers remain uncitable: before `1146265` the requested section
      torque was nose-up (`+4.839888e5 N.m`).
    citations_forbidden: true
    rows: []
  - id: experimental_validation
    scope: "experimental validation, wind tunnel or field"
    status: not_validated
    reason: >-
      Every reference in this suite is a code, a closed form or a published
      model; none is a measurement.
    evidence: >-
      The reference kinds in the store are paper, code, analytical and
      self.
    consequence: >-
      The paper may claim code-to-code and code-to-publication
      verification. It may not claim agreement with experiment, because
      none was used.
    citations_forbidden: true
    rows: []

  - id: force_projection_sense_p5
    scope: BEM to mesh load frame and sense (ForceProjector, defect P5)
    status: open_defect
    reason: >-
      The frame and the sense are fixed and pinned; what remains open is the
      prohibition, not the work: every campaign number produced BEFORE these
      fixes had its aerodynamic load pushing upwind and braking the rotor, so
      those numbers carry the wrong sign and cannot be reused. The convention is
      arbitrated once, against the deck itself, by
      `tools/diagnose_sign_chain.py` (every real station ring matched to its
      WindIO aerofoil, residual 0.5-3.6% of chord): the deck puts the leading
      edge at positive x and the load-frame downwind (thrust) direction at
      positive y, so a rigid +z rotation moves the leading edge downwind and
      NOSE-DOWN is `omega > 0`. `ForceProjector` records the per-strip
      `_strip_moment_axis_sign` and applies the aerodynamic pitching moment on
      it, because the deck's leading-to-trailing direction runs against
      `_strip_chord_dirs` at every real station (`LE . c_hat = -1.0`); the old
      guards asserted the inverted `omega < 0` and let the wrong-axis moment
      pass.
    evidence: >-
      Frame: the load axis comes per strip from the section outline, guarded by
      `tests/validation/bem/test_force_projection_load_frame.py`: worst
      `|F.c_hat|/|F| = 0.0116` and `|F.f_hat|/|F| = 0.9999` for `Np` (the same
      pair for `Tp`), worst `angle(F, f_hat) = 0.662 deg`, uniform-`Np`
      conservation `0.74%`, against bounds 5% / 5% / 10 deg / 5%. The moment
      check builds its per-strip frame from the ring outline and reproduces the
      applied moment to `1.76e-15` relative, bound 1%. Sense: with the
      production defaults the rated summed load points downwind
      (`F.y = +8.4444e5 N`, `|F| = 8.5263e5 N`), `1.30%` off `bem.thrust/3`
      against a 2% bound, and delivers `+5.256 MW` for `Omega = +0.7917 y`.
    consequence: >-
      The re-derivation this gap asked for has been done and is stored: the
      de-loading is measured in one sign convention by
      `tests/validation/blade/test_blade_deloading_vs_reference.py`, and the
      elastic tip twist is now `+8.1048 deg` nose-down at the tip (minimum-norm;
      `+9.6669 deg` with the with-properties multi-cell path), not the pre-fix
      `-1.5112 deg`. Corrected de-loading (thrust/power): twist only
      `-26.01% / -15.61%`, radii only `+1.24% / +0.95%`, production path
      `-25.31% / -14.77%`, against Zhou Table 6's `-13.04% / -8.38%`. What
      remains is the prohibition, not the work: numbers quoted from the pre-fix
      path are uncitable, and the few-percent power residual against the
      published rating is reported rather than tuned.
    citations_forbidden: true
    rows: []
  - id: force_projection_axial_extension
    scope: >-
      the linear structural solve on the prebent blade axis, not the load
      frame
    status: open_defect
    reason: >-
      The deformed blade measures LONGER along the span than the reference
      centroid path, and that growth re-loads the rotor. The cause first
      recorded here - the local spanwise force the nodal distribution injects -
      was measured and REFUTED (verdict 22.7): constraining the whole solve to
      the section plane makes `sum|fz| = 0` exactly and moves the displacement
      field by `max||du|| = 2.6e-3 m`, 0.016% of the 16.53 m response, with the
      axial tip displacement going `+1.0630 -> +1.0631 m`. The lengthening comes
      from the in-plane flapwise load acting on a curved (prebent) blade axis
      inside a single linear solve on a linear `K`, which cannot produce the
      second-order inextensional shortening the geometry implies. The solver
      named in the measurement is a static scipy replica in the diagnostic; the
      production rotor path is Rust/PETSc (`run_rotor_fsi_solver`), one linear
      KSP step per Newmark step. The mechanism is solver-independent, the
      magnitude below is not a production measurement.
    evidence: >-
      The deformed centroid path measures `119.1356 m` against a `117.2256 m`
      reference, `+1.629%`, with `sum fz = -3.5e-11 N` and `sum|fz| = 276,080 N`
      (24.99% of `sum|fy| = 1,104,872 N`), 99.16% of which is the AC lever-arm
      identity `M_bend = -dz_ac x (span x F)`, not torsion. Load split: the
      spanwise system alone gives `-0.0032 m` at the tip, the flapwise component
      alone `+1.0641 m`. Inextensional theory predicts about `-1.149 m` for a
      16.42 m flap over 117 m, and a linear solve cannot reach it, so the guard
      "assert the axial tip displacement is negative" is not writable against
      this model. Ring-centroid `y` runs `+0.36 m` at z = 24 m to `-4.00 m` at
      the tip, with about `0.9 m` of x curvature; the prebend/precurve split is
      not established.
    consequence: >-
      The radii feedback alone re-loads the rotor by `+1.24%` thrust and
      `+0.95%` power, so it offsets part of the twist-only de-loading
      (`-26.01% / -15.61%`), leaving the production path (twist + radii) at
      `-25.31% / -14.77%`. That offset is partly this artefact and not
      bend-twist. Numbers from the production path before the load-frame fixes
      stay non-citable. What is NOT owed any more is a load-frame fix: removing
      the spanwise force changes nothing measurable, so this gap is now a
      structural-model question about linear analysis on a curved axis. The
      twist/de-loading figures here are the corrected ones; the convention is
      arbitrated in `force_projection_sense_p5`.
    citations_forbidden: true
    rows: []
