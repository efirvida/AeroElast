# What the suite does NOT validate.
#
# A gap is a claim about absence, so it cannot be derived from the rows:
# a row that does not exist cannot be queried. This file is therefore
# data, and `check` validates it, because it is the one part of the
# validation scheme whose loss would be silent — the numbers stay green
# and the caveat disappears.
#
# `citations_forbidden: true` means: do not cite a result here as
# validation evidence. A `not_validated` entry has no result to cite; an
# `open_defect` entry has one that must not be cited, and its
# `consequence` says what that invalidates.
version: 1

gaps:
  - id: composite_stress_recovery
    scope: "composite outer-fibre stress recovery"
    status: not_validated
    reason: >-
      MOSTLY CLOSED, TWO LIMITS REMAIN (re-checked 2026-10-09): the
      ply-resolved recovery landed in T1-T4 of #27, and the membrane
      outer-fibre ply stress is now compared against CalculiX 2.20 S8R with
      `*SHELL SECTION, COMPOSITE` and an in-file CLT closed form (group 36,
      `composite_ply_stress`). The old premise was wrong in both directions:
      CalculiX does report the outer fibre on that card -- its FRD value is
      the expanded outer-fibre node, the midsurface node is exactly 0 -- so
      `OUTPUT=3D` being inert for composites is not a bar. What remains:
      (a) a section with no ply stack, i.e. a raw homogenised ABD dict,
      still returns the thickness-mean equivalent and only warns; and
      (b) the bending laminate `[0/90/90/0]` is measured (ours 616.10 MPa
      against CalculiX 595.59 MPa) but has no row, so it cannot be cited.
    evidence: >-
      Issue #27 and `odd/tasks/composite-ply-stress-recovery.md` (T1-T4:
      `95bfbab`, `208f220`, `bd4cc05`, `62d806a`), with the group 36 rows.
      Superseded text kept for the record: "`*SHELL SECTION, COMPOSITE`
      ignores `OUTPUT=3D`, so CalculiX cannot act as the independent stress
      judge it is for isotropic shells" and "A composite stress number has
      no independent reference in this suite".
    consequence: >-
      The membrane outer-fibre ply stress may be cited from group 36. The
      thickness-mean value a raw ABD section returns may not be cited as a
