  - id: radii_datum_definition_bias
    scope: >-
      the BEM annulus the deformed path feeds, against the deck's own station
      radii the rigid path uses
    status: open_defect
    reason: >-
      The two annuli are not the same annulus. The rigid path short-circuits
      before any deformed geometry is measured (`fsi_participant.py:910-912`),
      while the deformed path rebuilds the stations from the mesh's mean span
      projection (`:632`) with its datum anchored at a single point (`:402`,
      `_mesh_datum_offset = _ref_r[0] - _mesh_span.min()`). At zero displacement
      the two definitions differ by `+0.397959 m` (strip 0) and `-0.596870 m`
      (tip strip), so the first deformed iteration moves every station radius by
      up to 0.6 m on its own. No guard sees it: the rigid-path guard compares
      the short-circuit path against itself.
    evidence: >-
      Measured by
      `tests/validation/blade/test_blade_deloading_vs_reference.py` at HEAD
      2026-10-07: 5 passed, production `BEMFSIParticipant`, real
      IEA-15MW mesh and real AeroDyn `BladeAero` at the rated point, one shell
      solve under the participant's own projected loads. Every row is against
      the same construction baseline `_rebuild_bem_solver(_ref_r, _ref_twist)`
      = 2.541662 MN / 16.389372 MW. The four radii-family rows, thrust and power
      as `(flexible - rigid) / rigid` and the tip `dr` in metres: definition
      bias only (zero displacement) `-0.38% / -0.17%`, tip `dr -0.5969 m`;
      deformation increment only (projection metric) `+1.89% / +1.86%`, tip
      `dr +1.1062 m`; deformation increment only (path metric) `+3.63% /
      +3.56%`, tip `dr +2.1121 m`; radii feedback as production feeds it (bias +
      increment) `+1.24% / +0.95%`, tip `dr +0.5093 m`. The definition bias at
      zero displacement is `+0.397959 m` at strip 0 and `-0.596870 m` at the
      tip strip. `dr_proj` (production's deformation increment) tip =
      `+1.106156 m`; `dr_path` (the same increment under the path metric) tip =
      `+2.112061 m`, ratio `1.909x`, and the second-order transverse term is
      `47.6%` of the path increment. Path lengths of the deformed strip-centroid
      polyline: `L_ref = 116.181290 m`, `L_def = 118.293351 m`, `L_def/L_ref - 1
      = +1.8179%`. The three radii deltas are three separate BEM evaluations and
      are NOT additive (`-0.38% + 1.89% != +1.24%`). The identity pinned to
      `1e-9`: `dr_proj[k] == mean(displacements[strip k] . span_dir)`, i.e.
      `dr_proj` is the span projection of the strip's own spanwise
      displacement, a linear-solve axial response, not a path artefact.
    consequence: >-
      A radii-family figure from this table quoted as "the geometric
      re-loading" overstates the deformation's share: the `+1.24% / +0.95%` row
      is the net of a `-0.38% / -0.17%` definition bias and a `+1.89% / +1.86%`
      deformation increment, so it cannot be read as the deformation's
      contribution on its own. The table's other numbers keep their meaning. The
      standing prohibition holds: pre-fix coupled numbers stay uncitable.
    citations_forbidden: true
    rows: []

  - id: reference_projection_geometry_approximation
    scope: >-
      the force projection's geometry on the coupled path: the strip grid, the
      aerodynamic-centre arm and the pitching-moment axis
    status: not_validated
    reason: >-
      Since `6765633` the coupled fluid participant lays the BEM resultant out
      with the **reference** projector instead of rebuilding it on the deformed
      mesh, because that rebuild took the partitioned coupling's gain above its
      contraction threshold (issue #19: HEAD 39/500 windows, reference projector
      500/500). The BEM loads still follow the deformation; what no longer does
      is the within-strip distribution's offsets and the aerodynamic-centre
      lever arm, which are read once from the reference geometry. The error is
      O(deformation gradient x chord) - chord-scale against a blade-scale
      deformation - and it is not quantified here.
    evidence: >-
      `docs/validation_closures.md`, section "#19 y #26: la proyeccion conserva
      la geometria de referencia..." (2026-10-08); `odd/tasks/coupled-divergence.md`;
      guard
      `tests/validation/rotor/test_bem_fsi_deformed_geometry.py::test_force_projection_geometry_stays_on_the_reference`.
      The campaign's own projector followed the deformation and contracted
      (`b5d369e`, 500/500 windows), so a deformation-robust derivation of the
      same geometry - hysteresis-free ring selection, LE/TE tie-break and
      chord-axis continuity - is the alternative that would remove this
      approximation.
    consequence: >-
      Coupled numbers produced with this fix carry the approximation: the
      applied load's distribution and lever arm are the reference ones. Any
      comparison against the 2026-09-30 campaign baseline has to state it, and
      re-anchoring the campaign on the fixed path - the roadmap's next step -
      produces a baseline that carries it.
    citations_forbidden: true
    rows: []
  - id: zhou_spanwise_load_frame
    scope: "the spanwise Np/Tp comparison against Zhou et al. 2025 Fig. 11"
    status: not_validated
    reason: >-
      The reference cannot arbitrate a tangential magnitude, and the comparison
      the report used to take from it mixed two frames. Measured 2026-10-08
      (issue #15): Zhou's published pair is a **section (chord) frame** pair -
      read with `alpha = atan2(Tp, Np) + atan2(Cd, Cl)` it reproduces their own
      Fig. 10 angle of attack to 0.37 deg over the blade core, where the
      rotor-plane reading is off by 6.83 deg - while `BEMSolver` emits the
      **rotor-plane** pair by construction. Their Fig. 11 is also the flexible
      case (its digitized thrust x3 is 2.20 MN, Table 6's flexible value, not
      the rigid 2.53 MN) and its trapezoid carries only 11.68 MW of the 14.76
      MW the paper itself reports, so no integral claim travels through the
      digitization. What is left after fixing the frame is our inflow-angle
      bias against their LL-FVW (0.9 deg at r/R 0.26 to 4.8 deg at the tip),
      which is already reported in section 5.11 and which `Tp` magnifies because
      it is the difference of two large terms.
    evidence: >-
      `tools/diagnose_zhou_tp_frame.py` (production BEM at Zhou's own rated
      point, V=10.59 m/s, 7.55 rpm, pitch 0, official AeroDyn deck) and its
      guard `tests/validation/bem/test_bem_load_frame.py`. The report's numbers
      (`int Np dr = 669.1 kN`, `int Tp dr = 101.7 kN`, `int (Tp r) dr` = 6.21
      MN.m, peak Tp 1.05 vs 0.80 kN/m) came from
      `frontiersin_results_corotational`, a campaign that no longer exists on
      disk; they are kept in section 5.9 as a record and are not reproducible.
    consequence: >-
      `Tp` cannot be cited as a magnitude against Zhou, and the `+31%` the
      report carried is not a polar or model defect but the frame plus the
      known angle-of-attack bias. Only the pointwise direction comparison
      (`Tp/Np`) and the shape/scale reading are defensible. V-09 stays class B,
      as a contextual comparison and not a formal closure.
    citations_forbidden: true
    rows: []
