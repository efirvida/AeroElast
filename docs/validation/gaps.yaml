# What the suite does NOT validate.
#
# A gap is a claim about absence, so it cannot be derived from the rows:
# a row that does not exist cannot be queried. This file is therefore
# data, and `check` validates it, because it is the one part of the
# validation scheme whose loss would be silent — the numbers stay green
# and the caveat disappears.
#
# `citations_forbidden: true` means: do not cite a result here as
# validation evidence. A `not_validated` entry has no result to cite; an
# `open_defect` entry has one that must not be cited, and its
# `consequence` says what that invalidates.
version: 1

gaps:
  - id: composite_stress_recovery
    scope: "composite outer-fibre stress recovery"
    status: not_validated
    reason: >-
      MOSTLY CLOSED, TWO LIMITS REMAIN (re-checked 2026-10-09): the
      ply-resolved recovery landed in T1-T4 of #27, and the membrane
      outer-fibre ply stress is now compared against CalculiX 2.20 S8R with
