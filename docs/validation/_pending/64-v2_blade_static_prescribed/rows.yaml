- id: v2_blade_static_prescribed.s2_v2_lc1_tip_displacement
  group: '64'
  title: S-2 v2 LC1 tip displacement vs OpenFAST BeamDyn p60
  tests:
  - tests/validation/blade/v2/test_v2_iea15mw_s2_static_prescribed.py::TestV2S2StaticPrescribed::test_dominant_component_matches_beam[LC1_gravity]
  validates: v2-mesh shell tip uy for LC1 against the OpenFAST BeamDyn static driver (K9/K11.3).
  comparisons:
  - label: Tip displacement relative error
    asserted: true
    reference:
      kind: code
      label: OpenFAST v5.0.0 BeamDyn driver p60, linear static, official v1.1 deck, LC1 tip uy, m
    tolerance:
      kind: rel_err
      value: 0.05
      source: tests/validation/blade/v2/test_v2_iea15mw_s2_static_prescribed.py:209
      justified: true
      justification: Same 5 % (K3, L3 ceiling) as the v1 test; reference is the OpenFAST BeamDyn static driver (K8/K9), BeamDyn p40-p60 move <= 0.13 %.
    measured:
      status: measured
      run: 0da03be+worktree
      date: '2026-11-03'
      raw: 0.018176
      margin_pct: 1.8176
      text: 'S-2 v2 LC1 tip uy: shell -2.190924 m vs BeamDyn p60 -2.231483 m, -1.8176 % (PASS); v2 mesh (windIO v2 mesher, build_v2_blade es 0.25, skin on mid-surface, no strip collapse), SLURM 11641783
        (logs/check/v2_s2/run-11641783.out).'
    expected: -2.231483
  flags: []
  notes: v2 counterpart of v1 row blade_static_prescribed.s2_official_lc1_tip_displacement; tip node = argmax z of the v2 tip ring.
