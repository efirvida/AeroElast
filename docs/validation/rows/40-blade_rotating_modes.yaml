      kind: rel_err
      value: 0.05
      source: tests/test_iea15mw_s4_rotating_modal.py:172
      justified: true
      justification: 'Maintainer rule 2026-10-16: every L3 tolerance <= 5 %. Pass/fail is decided against OpenFAST v5 BeamDyn single member p20 on the official v1.1 deck (K8.2: the model that uses the whole deck defines the structure aeroelast must reproduce); ElastoDyn MBC3 is printed as a comparison, not a criterion (maintainer 2026-10-20). The two decks disagree by 6-8 % on this blade (recorded finding about the references).'
