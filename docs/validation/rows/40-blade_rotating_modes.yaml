- id: blade_rotating_modes.s4_parked_openfast_modes
  group: '40'
  title: S-4 parked modes vs OpenFAST MBC3
  tests:
  - tests/test_iea15mw_s4_rotating_modal.py::test_s4_rotating_modal_vs_openfast[0.0]
  validates: Parked blade modal frequencies against OpenFAST v5.0.0 MBC3.
  comparisons:
  - label: First flap frequency
    asserted: true
    reference:
      kind: code
      label: OpenFAST v5.0.0 BeamDyn p20 (official v1.1 deck) parked first flap, Hz
    tolerance:
      kind: rel_err
      value: 0.05
      source: tests/test_iea15mw_s4_rotating_modal.py:163
      justified: true
      justification: 'Maintainer rule 2026-10-16: every L3 tolerance <= 5 %. Pass/fail is decided against OpenFAST v5 BeamDyn single member p20 on the official v1.1 deck (K8.2: the model that uses the whole deck defines the structure aeroelast must reproduce); ElastoDyn MBC3 is printed as a comparison, not a criterion (maintainer 2026-10-20). The two decks disagree by 6-8 % on this blade (recorded finding about the references).'
    measured:
      status: measured
      run: 4d64ea8
      date: '2026-10-20'
      raw: 0.034237
      margin_pct: 3.4237
      text: 'S-4 parked 1F es 0.25, mid-surface: 0.524444 Hz vs OpenFAST v5.0.0 BeamDyn p20 (official v1.1 deck) 0.507083 (error +3.4237 %, bound 5 %) PASS; es 0.125 0.523888 Hz +3.3141 %, move 0.11 pp <= 1 pp (K7.2). ElastoDyn MBC3 printed as comparison only (K8.2). Test at 4d64ea8, SLURM 11620009 (es 0.25), 11619955 (es 0.125).'
    expected: 0.507083
