group: '34'
rows:
- id: blade_s7_torsion.test_s7_global_torsion_ratio_within_band.single
  group: '34'
  title: test_s7_global_torsion_ratio_within_band
  tests:
  - tests/validation/blade/test_iea15mw_s7_torsion.py::test_s7_global_torsion_ratio_within_band
  validates: >-
    The shell's global torsional response — the tip twist under a tip torsional
    moment — against the BeamDyn blade deck of the official IEA 15 MW model.
  comparisons:
  - label: rtol at line 88
    asserted: true
    reference:
      kind: code
      label: BeamDyn blade deck of the official IEA 15 MW reference turbine (IEA-15-240-RWT_BeamDyn_blade.dat, K[5,5] per station), integrated as a Timoshenko torsion beam
    tolerance:
      kind: rtol
      value: 0.3
      source: tests/validation/blade/test_iea15mw_s7_torsion.py:88
      justified: true
      justification: >-
        The bound is a +-30% window around exact agreement with the deck, and it
        is what the documented model difference justifies, not a fit to the run:
        the sectional shell GJ sits +17-24% above the BeamDyn tables (S-1), so
        an exact match is not the expectation and the envelope has to hold that
        difference plus the coarse-mesh discretisation it was chosen on. The
        measured 6.04% clears it by 24 points. A narrower bound would turn a
        documented model difference into a failure; the direction (below 1) is
        the asserted part.
    measured:
      status: measured
      run: 9a09772
      date: '2026-10-07'
      raw: 0.939603
      margin_pct: 6.0397
      text: >-
        shell/beam tip twist ratio over the 0.3-0.9 span band vs BeamDyn blade
        deck of the official IEA 15 MW reference turbine
        (IEA-15-240-RWT_BeamDyn_blade.dat, K[5,5] per station), integrated as a
        Timoshenko torsion beam: 0.939603 vs 1 (error: 6.0397%, bound: 30.0000%)
      digest: 84ef9c9d44926b27
  flags: []
  notes: >-
    The direction is the asserted part: the shell is stiffer than the deck, so
    the ratio runs below 1. Measured 0.939603 at element_size 0.25 and 0.933641
    at 0.125, which is 0.6% away. Between 2026-09-30 and 2026-10-04 the module
    carried a convergence table reading 1.273..1.406 — the opposite direction —
    and it does not reproduce at HEAD at any mesh size, with or without the
    element-winding canonicalisation that `22d3ccc` removed (which accounts for
    a factor 1.079 of the gap, not all of it). It was replaced with rows
    measured at HEAD. Evidence: issue #20, `odd/tasks/s7-torsion-ratio.md`, and
    `docs/validation_closures.md` section S-7 (2026-10-07).

    `tools/validation_matrix.py extract` regenerates this file from the code and
    fills `validates`, `justification` and `notes` with placeholders, so the
    prose here is hand-written and a re-extract drops it.
