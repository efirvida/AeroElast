group: '34'
rows:
- id: blade_s7_torsion.test_s7_global_torsion_ratio_within_band.single
  group: '34'
  title: test_s7_global_torsion_ratio_within_band
  tests:
  - tests/validation/blade/test_iea15mw_s7_torsion.py::test_s7_global_torsion_ratio_within_band
  validates: The shell's global torsional response — the tip twist under a tip torsional moment — against the BeamDyn blade deck of the official IEA 15 MW model.
  comparisons:
  - label: rtol at line 107
    asserted: true
    reference:
      kind: code
      label: BeamDyn blade deck of the official IEA 15 MW reference turbine (IEA-15-240-RWT_BeamDyn_blade.dat, K[5,5] per station), integrated as a Timoshenko torsion beam
    tolerance:
      kind: rtol
      value: 0.3
      source: tests/validation/blade/test_iea15mw_s7_torsion.py:107
      justified: true
      justification: 'The bound is a +-30% window around exact agreement with the deck, chosen on the documented sectional model difference (S-1) plus the coarse-mesh envelope, not fitted to the run. It is far wider than the effects it names: it could see neither the 10.2% couple under-delivery (72f64de) nor the 16% staircase in the beam reference (E8), which is why each carries its own exact test. Measured 0.8670 at es=0.25 against the integral-to-z reference: the shell twists 13.3% less than the beam, so its global GJ is about 15% above the deck, on the same side as S-1. Most of the excess tracks the skin reference surface (OML nodes, laminate centred on them; odd/tasks/s7-torsion-ratio.md E8); about 2-3% depends on the unverified BeamDyn interpolation between key points. This comparison is over the 5% ceiling and carries no quantified exception: it is a finding for the L3 audit, not a pass.'
    measured:
      status: measured
      run: 7fb832b
      date: '2026-10-11'
      raw: 0.867017
      margin_pct: 13.2983
      text: 'shell/beam tip twist ratio over the 0.3-0.9 span band vs BeamDyn blade deck of the official IEA 15 MW reference turbine (IEA-15-240-RWT_BeamDyn_blade.dat, K[5,5] per station), integrated as a Timoshenko torsion beam: 0.867017 vs 1 (error: 13.2983%, bound: 30.0000%)'
      digest: 600fe16e43d1a16d
  flags: []
  notes: 'Corrected twice. 2026-10-10 (72f64de): the tip couple under-delivered the applied moment by kappa = 0.8978 at this mesh; with the load honoured the ratio read 1.046588. 2026-10-11 (E8): beam_twist_profile_deg integrated 1/GJ only up to the last BeamDyn station at or below each section and dropped the partial segment, under-stating the beam twist by 16% on average over the band (37% at worst). Integrated to z, the convergence record reads 0.9251 / 0.9227 / 0.8874 / 0.8670 at element_size 2.0 / 1.0 / 0.5 / 0.25, and about 0.861 derived at 0.125. The sectional-versus-global sign disagreement that E7 left open was this reference error: S-1 at HEAD gives +10.8% signed (12.7% mean |rel|, not the 23.9% its docstring states), on the same side. A counterfactual that moves the skin nodes to the laminate mid-surface closes the ratio to 0.973 at es=0.25. Evidence: issue #20, odd/tasks/s7-torsion-ratio.md sections E7 and E8, tools/diagnose_s7_beam_reference.py, tools/diagnose_oml_reference_surface.py.'
