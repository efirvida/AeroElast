group: '39'
rows:
- id: blade_static_prescribed.s2_official_lc1_tip_displacement
  group: '39'
  title: S-2 official LC1 gravity displacement vs in-house EB beam (ElastoDyn EI)
  tests:
  - tests/test_iea15mw_s2_static_prescribed.py::TestS2StaticPrescribed::test_dominant_component_matches_beam[LC1_gravity-official]
  validates: Official-blade dominant shell tip displacement relative error for LC1 gravity against the BeamDyn reference.
  comparisons:
  - label: Dominant tip displacement relative error
    asserted: true
    reference:
      kind: code
      label: BeamDyn/ElastoDyn LC1 gravity beam reference displacement
    tolerance:
      kind: rel_err
      value: 0.05
      source: tests/test_iea15mw_s2_static_prescribed.py:122
      justified: true
      justification: 'Maintainer rule 2026-10-16: every L3 tolerance <= 5 %. Reference is a beam model built from the ElastoDyn EI and mass (the two reference decks differ by more than 5 %, so a pass is not independent confirmation). Against the BeamDyn elastic-centre EI instead (decision (b)), the OML shell reads +9.46 % (LC1), -6.54 % (LC2), -11.92 % (LC4); the mid-surface shell -1.60 %, +7.23 %, +1.28 %.'
    measured:
      status: measured
      run: 19ff1a3
      date: '2026-10-20'
      raw: 0.055314
      margin_pct: 5.5314
      text: 'S-2 LC1 gravity tip uy es 0.25 official blade, skin on mid-surface: shell -2.066107 m vs EB beam (ElastoDyn EI) -1.957812 m, rel 5.5314 %, bound 5 % FAIL, 0.53 pp over (K3b: undecided until es 0.125; reference is not an arbiter); capture SLURM 11619652 (S-1/S-2/V-03) and 11619653 (S-4) at 19ff1a3, bit-identical to the B3-1r head capture (K1).'
    expected: null
  flags: []
  notes: 'Measured at 19ff1a3 (B3-2 batch 1, es 0.25, skin on mid-surface); verdict in contract.yaml. MISMATCH: row title/reference label say BeamDyn, but the test compares against an Euler-Bernoulli beam built from ElastoDyn EI and mass (BeamReference.from_mesh), which is 4-14 % too stiff vs the BeamDyn static driver (T3); reference NOT edited. Against the BeamDyn driver p60 (T4 step 1, es 0.25, S-2 node): LC1 oml -17.36 / mid -7.46 %, LC2 oml -15.69 / mid -3.70 %, LC4 oml -18.24 / mid -6.26 %. Raw/margin_pct hold the relative error as a fraction / percent (signed in text); earlier measured blocks held displacements.'
