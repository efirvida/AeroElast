- id: blade_static_prescribed.s2_official_lc1_tip_displacement
  group: '39'
  title: S-2 official LC1 gravity tip displacement vs OpenFAST BeamDyn p60
  tests:
  - tests/test_iea15mw_s2_static_prescribed.py::TestS2StaticPrescribed::test_dominant_component_matches_beam[LC1_gravity-official]
  validates: Official-blade shell tip uy for LC1 gravity against the OpenFAST BeamDyn static driver (K9).
  comparisons:
  - label: Dominant tip displacement relative error
    asserted: true
    reference:
      kind: code
      label: OpenFAST v5.0.0 BeamDyn driver p60, linear static, official v1.1 deck, LC1 gravity tip uy, m
    tolerance:
      kind: rel_err
      value: 0.05
      source: tests/test_iea15mw_s2_static_prescribed.py:146
      justified: true
      justification: 'Maintainer rule 2026-10-16: every L3 tolerance <= 5 %. Reference is the OpenFAST BeamDyn static driver on the official deck (K8/K9), not our own beam; the in-house EB beam is printed as a comparison only. BeamDyn p40-p60 move <= 0.13 %.'
    measured:
      status: measured
      run: d5d0fd2
      date: '2026-10-24'
      raw: 0.052584
      margin_pct: 5.2584
      text: 'S-2 LC1 official blade: shell -2.114143 m vs BeamDyn p60 -2.231483 m, -5.2584 % (FAIL); blade input audit T9 tree (T7d..T12 + G10/G10b + T14/T15, yaml webs), es 0.25, skin on mid-surface; SLURM 11623286 (logs/check/input-fix/batch-input-fix-T15m-11623286.log, capture-T15m.pkl) at d5d0fd2.'
    expected: -2.231483
  flags: []
  notes: Judged against BeamDyn p60 (K9) at 44ebffa; earlier in-house beam comparison superseded. Verdict in contract.yaml.
