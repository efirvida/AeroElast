- id: blade_static_prescribed.s2_official_lc1_tip_displacement
  group: '39'
  title: S-2 official LC1 gravity tip displacement vs OpenFAST BeamDyn p60
  tests:
  - tests/validation/blade/v2/test_v2_iea15mw_s2_static_prescribed.py::TestV2S2StaticPrescribed::test_dominant_component_matches_beam[LC1_gravity]
  validates: Official-blade shell tip uy for LC1 gravity against the OpenFAST BeamDyn static driver (K9).
  comparisons:
  - label: Dominant tip displacement relative error
    asserted: true
    reference:
      kind: code
      label: OpenFAST v5.0.0 BeamDyn driver p60, linear static, official v1.1 deck, LC1 gravity tip uy, m
    tolerance:
      kind: rel_err
      value: 0.05
      source: tests/validation/blade/v2/test_v2_iea15mw_s2_static_prescribed.py:235
      justified: true
      justification: 'Maintainer rule 2026-10-16: every L3 tolerance <= 5 %. Reference is the OpenFAST BeamDyn static driver on the official deck (K8/K9), not our own beam; the in-house EB beam is printed as a comparison only. BeamDyn p40-p60 move <= 0.13 %.'
    measured:
      status: not_measured
      margin_pct: null
    expected: -2.231483
  flags: []
  notes: 'Repointed (L-S85, odd/tasks/gmsh-official-mesher.md) from the v1 test tests/test_iea15mw_s2_static_prescribed.py::TestS2StaticPrescribed::test_dominant_component_matches_beam[LC1_gravity-official], deleted at c70247c, to its windIO v2 + gmsh twin. measured = not_measured: the v1 values live in history only, they came from another test on another mesh. Reference, tolerance and band unchanged. Re-measure with `tools/validation_matrix.py regression --group 39`. Earlier note: Judged against BeamDyn p60 (K9) at 44ebffa; earlier in-house beam comparison superseded. Verdict in contract.yaml.'
  history:
  - rev: d5d0fd2
    note: 'v1 measurement, NOT the current one (L-S85): taken on tests/test_iea15mw_s2_static_prescribed.py::TestS2StaticPrescribed::test_dominant_component_matches_beam[LC1_gravity-official] (deleted at c70247c, NuMAD mesh es 0.25 mid-surface), comparison ''Dominant tip displacement relative error'': raw 0.052584, margin 5.2584 %, 2026-10-24. S-2 LC1 official blade: shell -2.114143 m vs BeamDyn p60 -2.231483 m, -5.2584 % (FAIL); blade input audit T9 tree (T7d..T12 + G10/G10b + T14/T15, yaml webs), es 0.25, skin on mid-surface; SLURM 11623286 (logs/check/input-fix/batch-input-fix-T15m-11623286.log, capture-T15m.pkl) at d5d0fd2.'
    evidence: git show c70247c^:tests/test_iea15mw_s2_static_prescribed.py
  - rev: 0da03be+worktree
    note: 'windIO-v2-mesher measurement staged before the gmsh mesher (retired mesher, NOT the current one): margin 1.8176 %, 2026-11-03. S-2 v2 LC1 tip uy: shell -2.190924 m vs BeamDyn p60 -2.231483 m, -1.8176 % (PASS); v2 mesh (windIO v2 mesher, build_v2_blade es 0.25, skin on mid-surface, no strip collapse), SLURM 11641783 (logs/check/v2_s2/run-11641783.out).'
