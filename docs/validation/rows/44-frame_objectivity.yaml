      run: fe95159
      date: '2026-10-13'
      raw: null
      margin_pct: 5.6761e-13
      text: 'MITC4 internal force of a rigid rotation (5 deg) vs a rigid motion produces no strain, f_int(u_rigid) = 0: 5.6761e-13 (bound: 1e-09)'
      digest: f430eefff2c309fd
    expected: 0
  - label: f_int(u_rigid) norm relative to the 1e-3 stretch force scale (30 deg)
    asserted: true
    reference:
      kind: analytical
      label: A rigid motion produces no strain, so f_int(u_rigid) = 0
    tolerance:
