- id: frame_objectivity.tangent_under_rigid_rotation
  group: '44'
  title: MITC4 tangent stiffness under a finite rigid rotation about z (TL and corotational)
  tests:
  - tests/test_corotational_large_rotation_validation.py::test_tangent_is_frame_objective_under_rigid_rotation[1.0-assemble_kt]
  - tests/test_corotational_large_rotation_validation.py::test_tangent_is_frame_objective_under_rigid_rotation[1.0-assemble_kt_corotational]
  - tests/test_corotational_large_rotation_validation.py::test_tangent_is_frame_objective_under_rigid_rotation[5.0-assemble_kt]
  - tests/test_corotational_large_rotation_validation.py::test_tangent_is_frame_objective_under_rigid_rotation[5.0-assemble_kt_corotational]
  - tests/test_corotational_large_rotation_validation.py::test_tangent_is_frame_objective_under_rigid_rotation[30.0-assemble_kt]
  - tests/test_corotational_large_rotation_validation.py::test_tangent_is_frame_objective_under_rigid_rotation[30.0-assemble_kt_corotational]
  validates: The translational block of K_t(u_rigid) equals T K0 T^T for a rigid rotation of 1, 5 and 30 degrees, for both assemble_kt and assemble_kt_corotational.
  comparisons:
  - label: relative Frobenius error of K_t(u_rigid) against T K0 T^T (1 deg, assemble_kt)
    asserted: true
    reference:
      kind: analytical
      label: Frame objectivity identity K_t(u_rigid) = T K0 T^T, T = I (x) R, from the test source
    tolerance:
      kind: atol
      value: 1.0e-09
      source: tests/test_corotational_large_rotation_validation.py:TOL_OBJECTIVITY
      justified: true
      justification: Round-off bound. Measured 2.6e-12 / 1.7e-12 / 2.0e-12 at 1 / 5 / 30 degrees (SLURM 11614644, tools/diagnose_frame_objectivity.py), three orders of margin; a frame-dependent tangent errs by 1e-3 or more.
    measured:
      status: measured
      run: fe95159
      date: '2026-10-13'
      raw: null
      margin_pct: 2.57825e-12
      text: 'MITC4 tangent under rigid rotation (assemble_kt, 1 deg) vs frame objectivity identity K_t(u_rigid) = T K0 T^T: 2.57825e-12 (bound: 1e-09)'
      digest: 74cb1d21aa926ac9
    expected: T K0 T^T
