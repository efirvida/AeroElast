- id: frame_objectivity.rigid_rotation_internal_force
  group: '44'
  title: MITC4 internal force of a finite rigid rotation about z vanishes
  tests:
  - tests/test_corotational_large_rotation_validation.py::test_rigid_rotation_produces_no_internal_force[1.0]
  - tests/test_corotational_large_rotation_validation.py::test_rigid_rotation_produces_no_internal_force[5.0]
  - tests/test_corotational_large_rotation_validation.py::test_rigid_rotation_produces_no_internal_force[30.0]
  validates: assemble_fint at a rigid-rotation displacement is zero relative to the force of a 1e-3 uniform stretch of the undeformed structure.
  comparisons:
  - label: f_int(u_rigid) norm relative to the 1e-3 stretch force scale (1 deg)
    asserted: true
    reference:
      kind: analytical
      label: A rigid motion produces no strain, so f_int(u_rigid) = 0
    tolerance:
      kind: atol
      value: 1.0e-09
      source: tests/test_corotational_large_rotation_validation.py:TOL_OBJECTIVITY
      justified: true
      justification: Round-off bound. Measured 5.4e-13 / 5.7e-13 / 8.6e-13 at 1 / 5 / 30 degrees (SLURM 11614644), three orders of margin.
    measured:
      status: measured
      run: fe95159
      date: '2026-10-13'
      raw: null
      margin_pct: 5.391e-13
      text: 'MITC4 internal force of a rigid rotation (1 deg) vs a rigid motion produces no strain, f_int(u_rigid) = 0: 5.391e-13 (bound: 1e-09)'
      digest: 6120335c45f73253
    expected: 0
  - label: f_int(u_rigid) norm relative to the 1e-3 stretch force scale (5 deg)
    asserted: true
    reference:
      kind: analytical
      label: A rigid motion produces no strain, so f_int(u_rigid) = 0
