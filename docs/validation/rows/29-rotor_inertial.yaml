- id: rotor_inertial.testinertialforcescalculator_test_centri.single
  group: '29'
  title: TestInertialForcesCalculator::test_centrifugal_force_magnitude
  tests:
  - tests/validation/rotor/test_rotor_inertial.py::TestInertialForcesCalculator::test_centrifugal_force_magnitude
  validates: Centrifugal force should equal m * omega^2 * r.
  comparisons:
  - label: rtol at line 208
    asserted: true
    reference:
      kind: analytical
      label: the centrifugal closed form m omega^2 r
    tolerance:
      kind: rtol
      value: 1.0e-10
      source: tests/validation/rotor/test_rotor_inertial.py:208
      justified: true
      justification: extracted from the code; whether the justification holds is adjudicated in the pilot (T6)
    measured:
      status: not_measured
      margin_pct: null
  flags: []
  notes: 'Derived by `validation_matrix extract` from the code alone: the human-facing description and the adjudicated reference land in the pilot''s T5/T6. No margin is measured yet.'
