- id: newmark_analytic_frequency.s3_newmark_dispersion
  group: '43'
  title: S-3 Newmark transient frequency vs trapezoidal-rule dispersion of the mesh's own eigenfrequency
  tests:
  - tests/test_iea15mw_s3_newmark_transient.py::test_newmark_frequency_matches_discrete_dispersion
  validates: The time integrator alone, with the mesh error removed, against the exact trapezoidal dispersion relation omega_d = (2/dt) atan(omega dt / 2).
  comparisons:
  - label: Newmark frequency vs trapezoidal dispersion
    asserted: true
