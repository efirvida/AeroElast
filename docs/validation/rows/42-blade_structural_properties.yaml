    group: '42'
    title: V-05 BeamDyn K55 vs ElastoDyn flapwise EI
    tests:
      - >-
        tests/test_iea15mw_v05_structural_properties.py::TestBeamDynK55K66Consistency::test_k55_consistent_with_ei_flap[0.0-149700000000.0]
    validates: >-
      BeamDyn K55 flapwise stiffness relative difference against ElastoDyn
      FlpStff at r/R 0.00.
    comparisons:
      - label: Relative difference at r/R 0.00
        asserted: true
        reference:
          kind: code
          label: ElastoDyn FlpStff at r/R 0.00, 1.525e11 N m^2
        tolerance:
          kind: rel_err
          value: 0.20
          source: tests/test_iea15mw_v05_structural_properties.py:76
          justified: true
          justification: >-
            Source gives qualitative Timoshenko, coordinate and station reasons;
            no quantified L3 ceiling exception is established.
        measured:
          status: not_measured
        expected: 152500000000
    flags: []
    notes: Source assertion only; no result or verdict recorded.
