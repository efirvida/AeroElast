- id: blade_iea15mw.test_blade_mass_matches_published_models.single
  group: '23'
  title: test_blade_mass_matches_published_models
  tests:
  - tests/validation/blade/test_blade_iea15mw_validation.py::test_blade_mass_matches_published_models
  validates: The meshed blade mass is within ``MASS_TOL`` of the published models.
  comparisons:
  - label: rtol at line 328
    asserted: true
    reference:
      kind: paper
      label: Bernardi et al. 2025, the published article, blade mass
      citation: bernardi2025
    tolerance:
      kind: rtol
      value: 0.05
      source: tests/validation/blade/test_blade_iea15mw_validation.py:328
      justified: true
      justification: extracted from the code; whether the justification holds is adjudicated in the pilot (T6)
    measured:
      status: not_measured
      margin_pct: null
  flags: []
  notes: 'Derived by `validation_matrix extract` from the code alone: the human-facing description and the adjudicated reference land in the pilot''s T5/T6. No margin is measured yet.'
