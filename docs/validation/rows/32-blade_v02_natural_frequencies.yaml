- id: blade_v02_natural_frequencies.testv2bladenaturalfrequencies_test_1st_f.single
  group: '32'
  title: TestV2BladeNaturalFrequencies::test_1st_flapwise_frequency
  tests:
  - tests/validation/blade/v2/test_v2_iea15mw_v02_natural_frequencies.py::TestV2BladeNaturalFrequencies::test_1st_flapwise_frequency
  validates: 1st flapwise freq must be within ±5 % of 0.5585 Hz [R1][R4].
  comparisons:
  - label: rtol at line 124
    asserted: true
    reference:
      kind: paper
      label: NREL/TP-5000-75698 Table 5-2, 1st flapwise [R1]
      citation: gaertner2020
    tolerance:
      kind: rtol
      value: 0.05
      source: tests/validation/blade/v2/test_v2_iea15mw_v02_natural_frequencies.py:124
      justified: true
      justification: 'Maintainer rule 2026-10-16: every L3 tolerance <= 5 %. The declared reference (NREL/TP-5000-75698 Table 5-2) describes the v1.0 blade while the decks and the yaml are v1.1 (finding 2026-10-16), so it is not an arbiter (K4): a fail is reported, a pass would not validate.'
    measured:
      status: not_measured
      margin_pct: null
  flags: []
  notes: 'Repointed (L-S85, odd/tasks/gmsh-official-mesher.md) from the v1 test tests/validation/blade/test_iea15mw_v02_natural_frequencies.py::TestBladeNaturalFrequencies::test_1st_flapwise_frequency, deleted at c70247c, to its windIO v2 + gmsh twin. measured = not_measured: the v1 values live in history only, they came from another test on another mesh. Reference, tolerance and band unchanged. Re-measure with `tools/validation_matrix.py regression --group 32`. Earlier note: Re-measured at 19ff1a3 by `regression --write` (SLURM 11619654), es 0.25, skin on mid-surface; 1E bound 0.10 -> 0.05 in the same commit (ADJ-1034 withdraws ADJ-1032). Verdicts in contract.yaml; re-pointing or dropping the v1.0 reference is a follow-up.'
  history:
  - rev: d5d0fd2
    note: 'v1 measurement, NOT the current one (L-S85): taken on tests/validation/blade/test_iea15mw_v02_natural_frequencies.py::TestBladeNaturalFrequencies::test_1st_flapwise_frequency (deleted at c70247c, NuMAD mesh es 0.25 mid-surface), comparison ''rtol at line 133'': raw 0.518922, margin 7.0865 %, 2026-10-24. 1st flapwise natural frequency [Hz] vs NREL/TP-5000-75698 Table 5-2, 1st flapwise [R1]: 0.518922 vs 0.5585 (error: 7.0865%, bound: 5.0000%)'
    evidence: git show c70247c^:tests/validation/blade/test_iea15mw_v02_natural_frequencies.py
