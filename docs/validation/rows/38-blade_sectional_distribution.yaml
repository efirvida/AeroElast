- id: blade_sectional_distribution.s1_sectional_edgewise_ei
  group: '38'
  title: S-1 edgewise sectional EI vs BeamDyn
  tests:
  - tests/test_iea15mw_s1_sectional.py::TestS1SectionalProperties::test_edgewise_ei_matches_beamdyn
  validates: Mid-span mean absolute relative error of the edgewise EI distribution against BeamDyn.
  comparisons:
  - label: Mid-span mean relative error
    asserted: true
    reference:
      kind: code
      label: BeamDyn sectional distribution in the official IEA 15 MW deck
    tolerance:
      kind: rel_err
      value: 0.05
      source: tests/test_iea15mw_s1_sectional.py:107
      justified: true
      justification: 'Maintainer rule 2026-10-16: every L3 tolerance <= 5 %. Reference is the BeamDyn 6x6 deck reduced to the elastic centre and principal axes (sectional arbiter, decision (b)); a pass is not independent confirmation of the layup.'
    measured:
      status: measured
      run: 7324508
      date: '2026-10-17'
      raw: 0.127
      margin_pct: 12.7
      text: 'S-1 EI_edge es 0.25, skin on mid-surface: mean |rel err| 12.70 % (signed -12.10 %) vs BeamDyn, bound 5 % FAIL. OML contrast: 12.0 % (signed -11.11 %); mid worsens edge by 0.7 pt (extraction defect T8). SLURM mid 11617752 / oml 11617746; full suite 11617933 confirms.'
    expected: null
  flags: []
  notes: Source assertion only; no result or verdict recorded.
