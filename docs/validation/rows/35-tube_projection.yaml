  notes: >-
    Measured at dc585aa. Against the continuum closed form the production path is 3.11% high (10 mm
    wall) / 3.24% high (0.5 mm), and the excess is entirely the projector's outer-band quadrature:
    `ForceProjector` extends the first and last strip bands half a spacing past the stations, so
    `sum_k dr_k = L + DZ = 6.2 m` and the projected load's own torque ruler reads `e f (L + DZ)`.
    Against the discrete Saint-Venant response to that same station load the path is 0.22% / 0.09%.
    The force-conservation, torque-ruler, twist-sign and through-the-centre control assertions are
    load identities and physics properties, not comparisons against a reference, so they are no
    rows. Evidence: odd/tasks/production-path-and-independent-arbiters.md (Work units - P1a).
