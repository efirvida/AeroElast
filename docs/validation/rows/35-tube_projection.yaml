  validates: >-
    The clamped-free closed rectangular tube's tip rotation (theta_z) under the rated load pattern -
    normal force plus transfer moment - realised by the production `ForceProjector.project()`, against
    the continuum Bredt closed form `e f L^2 / (2 GJ)` and against the exact discrete Saint-Venant
    response to the projector's own station load.
