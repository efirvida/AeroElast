# Adjudication record for group 32, written by the session that documented the
# comparison.
#
# `extract --write` regenerates a row's `justification` and `notes` from the code
# alone - only `measured` survives a re-extraction, by design - so the human
# verdict on a bound lives here, where `check` validates it, not in the row.

group: "32"
scope: tests/validation/blade/test_iea15mw_v02_natural_frequencies.py
run: 11f62c3
date: 2026-10-06

adjudications:
  - id: ADJ-1032
    row: blade_v02_natural_frequencies.testbladenaturalfrequencies_test_1st_edg.single
    field: comparisons[*].tolerance.justification
    candidate_code: "_FREQ_TOL_EDGE = 0.10, a module literal of 0.10"
    verdict: the 10% is the published dispersion of this mode, not a fitted margin
    resolution: >-
      The comparison is valid and citable as it stands. The bound is the
      dispersion of the reference literature itself for this mode, not room
      granted to our solver. Zhou et al. 2025 (Energy 336:138488, doi
      10.1016/j.energy.2025.138488), Table 3 "Comparison of natural frequencies
      of the IEA-15 MW blade", gives the 1st edgewise frequency of six
      independent models: 0.665 (their GEBT), 0.692, 0.619, 0.547, 0.642 and
      0.642 Hz. Against the single value this row measures against (0.6406 Hz,
      NREL/TP-5000-75698 Table 5-2) that band is -14.6% to +8.0%, so the +/-14%
      the code cites is the table's own spread and not an estimate. The suite
      measured 0.698595 Hz, +9.05% against the reference and within 1% of the
      band's upper edge (0.692 Hz): inside the published dispersion of the mode.
      A 5% bound would therefore test our solver against the scatter of the
      reference. The 5% rule of CONTRIBUTING applies to a reference that carries
      that precision, and this one does not, so the bound stays at 10% with the
      evidence recorded here, on the maintainer's instruction of 2026-10-06
      ("esa comparacion con otras fuentes bien referenciadas es valida para el
      articulo"). Recorded separately: the code and the group note in
      groups.yaml said "eight methods" for a table with six, corrected on the
      same evidence.
    decided_by: session (validation store work), on the maintainer's standing instruction
    date: 2026-10-06
    status: resolved

  - id: ADJ-1033
    row: null
    field: group.provenance_note
    candidate_code: "not applicable: a group note, not a comparison"
    verdict: the group note misquoted the table it justifies the bound from
    resolution: >-
      The note said the 1st edgewise tolerance rests on "the eight methods
      compiled in Zhou et al. 2025 Table 3". Table 3 has six model columns
      (the present GEBT plus Refs. [74], [26], [55], [75] and [56]); eight is
      not what the table shows. The note now carries the band and its two
      endpoints so the two figures can be checked against the paper without
      re-deriving them, and the same correction is in the test docstring that
      the tolerance's `justification` is regenerated from.
    decided_by: session (validation store work)
    date: 2026-10-06
    status: resolved

  - id: ADJ-1034
    row: blade_v02_natural_frequencies.testbladenaturalfrequencies_test_1st_edg.single
    field: comparisons[*].tolerance.justification
    candidate_code: "_FREQ_TOL_EDGE = 0.05, a module literal of 0.05 (was 0.10)"
    verdict: ADJ-1032 is withdrawn; the 1st edgewise bound is the 5 % L3 ceiling
    resolution: >-
      ADJ-1032 kept a 10 % bound on the spread of Zhou et al. 2025 Table 3. That
      spread is between six different blade models, not an uncertainty on this
      row's reference value, and it was cited after the 0.6986 Hz measurement
      was known, so it is not a pre-measurement exception (contract.yaml,
      `fixed_before_measuring`). The maintainer rule of 2026-10-16 fixes every
      L3 tolerance at 5 % at most, and the user's B3-2 batch 1 instruction of
      2026-10-20 names this row ("V-02 1E y S-7 se ajustan a 0.05, rojo
      permitido"). The test is red by design at 5 %. Separately, the 0.6406 Hz
      reference describes the IEA-15 v1.0 blade while the decks and the yaml
      are v1.1 (odd/tasks/validation-l3-b3-audit.md, finding of 2026-10-16), so
      it cannot arbitrate this blade at any bound. ADJ-1032 stays in this file
      as the record of what was decided on 2026-10-06.
    decided_by: session (B3-2 batch 1), on the maintainer's 5 % rule and instruction
    date: 2026-10-20
    status: resolved
