adjudications:
  - id: ADJ-1001
    row: tube_moment_realization.test_production_shear_flow_moment_realis.single
    field: comparisons[*].tolerance.justification
    candidate_code: "tol=TOL, a module literal of 0.05"
    verdict: the bound is the suite rule, not a fitted margin
    resolution: >-
      Both comparisons are the 5% rule of CONTRIBUTING against Bredt's T/GJ
      twist rate, which is exact for this closed tube and independent of the
      code under test: GJ comes from the isotropic shear modulus and the
      enclosed area, and group 6 already validates the same closed form on the
      same mesh. Case A is the independent hand-written shear flow; case B is
      the production path (issue #11), which now realises the span moment as the
      same wall flow on a single usable ring. Both measure 0.3091%, a factor of
      sixteen inside the bound, so nothing was accommodated. The multi-ring
      realisation is not enabled and is recorded as the open defect
      `moment_realization_over_delivers` in gaps.yaml.
    decided_by: session (issue #9/#11 work), on the maintainer's standing instruction
    date: 2026-10-04
    status: resolved

  - id: ADJ-1002
    row: null
    field: group.granularity
    candidate_code: one source file per group
    verdict: a second source file in group 6 would have destroyed three measured rows
    resolution: >-
      The file was first declared as a second `source_files` entry of group 6,
      which shares its Bredt reference and looked like the natural home. It is
      its own group instead. `extract --write` derives a group's rows from one
      scope (`source_files[0]`, or `--scope`) and writes the whole row file, so
      re-extracting group 6 with a second file declared would have dropped the
      three rows already there and the margins `preserve_measurements` carries.
      `coherence` reads the same single scope, so a multi-file group would keep
      reporting itself coherent while ignoring the rest of its files. Every
      group in the store has exactly one source file, so this keeps the existing
      convention instead of inventing one. What the tool should do is either
      iterate all declared sources or refuse a group with more than one, and
      that is a change to the tool: flagged for the maintainer, not made here.
    decided_by: session 01a0fa52 (issue #9 work), on the maintainer's standing instruction
    date: 2026-10-04
    status: resolved
