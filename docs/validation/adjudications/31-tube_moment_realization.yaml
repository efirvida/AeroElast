# `extract --write` regenerates a row's `justification` and `notes` from the
# code alone - only `measured` survives a re-extraction, by design - so the
# human verdict on a bound lives here, where `check` validates it, not in the row.

group: "31"
scope: tests/validation/parity/test_thin_walled_tube_moment_realization.py
