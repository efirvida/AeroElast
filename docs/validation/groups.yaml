  - id: "19"
    title: >-
      `tests/validation/benchmarks/test_shell_analytical_validation.py`
      (beam and plate closed forms)
    slug: shell_analytical
    source_files:
      - tests/validation/benchmarks/test_shell_analytical_validation.py
    # Every comparison is against a textbook closed form, computed in the
    # file itself and stated by each call. The shear-locking test asserts
