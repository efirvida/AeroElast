# Group registry for the validation matrix.
#
# One entry per group of rows (the pytest files of sections 3-8, plus
# group 10 for out-of-band evidence). `docs/validation/rows/<id>.yaml`
# holds the rows of a group. The store is the rector: the Markdown views
# it used to generate are gone.
#
# Seeded with group 3 only: it is the pilot, see the task document
# odd/tasks/validation-matrix-store.md section 12. The remaining groups are
# added by work units WU-3..WU-5, which reuse the same pipeline.
version: 1

# Validation files that are not validation files, each with its reason. A test
# that compares nothing against an independent reference is not a row (rule 6),
# and a property, a machinery check or an investigation is a legitimate thing
# for a test under this tree to be. Declaring the file here is what separates
# "out of scope" from "forgotten", and `status` counts only the undeclared ones.
out_of_scope:
  - files:
      - tests/validation/parity/test_thin_walled_tube_moment_realization.py
    reason: >-
      It asserts that our own load machinery is consistent -- the torque ruler
      twice and the two walls of our own model agreeing -- and compares nothing
      against an independent reference. It exists to document a defect, and the
      defect is recorded where defects go: gaps.yaml,
      moment_realization_over_delivers.

  - files:
      - tests/validation/bem/test_bem_engine.py
    reason: >-
      It tests the BEM engine wrapper: construction from BladeAero, the
      shapes of its outputs, and that a parked blade's angle of attack
      equals the twist plus the pitch. Every one of those is a property of
      our own implementation, not a comparison against an independent
      reference.
  - files:
      - tests/validation/bem/test_bem_polars.py
    reason: >-
      It tests the aerodynamic data layer: polar interpolation, periodic
      wrapping, Reynolds-number selection, and loading the IEA 15 MW
      BladeAero from WindIO. That is the software that reads and serves
      the data, not a physical result measured against a reference.
  - files:
      - tests/validation/bem/test_force_projection.py
      - tests/validation/bem/test_force_projection_load_frame.py
    reason: >-
      The conservative force projection and its load-frame guard: force
      conservation, node assignment, and that the loads ride the section
      rather than a fixed global axis. They assert properties of our own
      load path, and the defects they document live in gaps.yaml, where
      force_projection_sense_p5 cites the second of these as its
      evidence.

  - files:
      - tests/validation/bem/test_force_projection_ac_datum.py
    reason: >-
      The production-datum guard for the force projection, and the third
      guard from issue #9 in this domain: the aerodynamic centre of every
      strip must sit at the station's own fraction of the chord, measured
      from the true leading edge, and the moment must be conserved. It
      asserts where our own load path places the datum, and its defect is
      recorded in gaps.yaml.

  - files:
      - tests/validation/element/test_quad_elements.py
    reason: >-
      Matrix properties and rigid-body modes for QUAD4, QUAD8 and QUAD9:
      shape, symmetry, positive semi-definiteness, and the rigid modes. The
      file says it itself -- the Rust assembler is the sole source of truth
      -- and none of those properties is a comparison against an independent
      reference.
  - files:
      - tests/validation/element/test_rust_composite.py
    reason: >-
      Composite shell element integration through the Rust batch
      functions and PyMeshAssembler. Its docstring is explicit that every
      test uses physical sanity checks only, and a sanity check is a
      property of our own implementation rather than a measurement
      against a reference.

  - files:
      - tests/validation/element/test_composite_b_coupling.py
    reason: >-
      Its assertions are signs and thresholds: that B is not zero for an
      asymmetric laminate, that the tip deflects with the sign B11 predicts,
      and that a symmetric laminate stays flat. Rule 4 calls a sign the
      strongest claim available, and none of these is a comparison against an
      independent reference, so rule 6 leaves them no row.

  - files:
      - tests/validation/element/test_rust_assembler.py
    reason: >-
      Its two comparisons are between two of our own implementations of the
      same model -- the Rust COO fast path and the PETSc setValuesLocal loop
      -- through np.testing.assert_allclose, which takes an atol and an rtol
      at once and prints no residual. The self kind exists for our own model
      against another of ours, but a row still needs one bound and one
      printable margin, and this file has neither. What it verifies is that
      the fast path agrees with the slow one, which is a software claim.

groups:
  - id: "3"
    title: >-
      `tests/validation/benchmarks/test_ko2017_performance.py`
      (Ko, Lee, Lee & Bathe 2017)
    slug: ko2017
    citation: ko2017_perf
    # What every comparison in this group is against. The extractor reads this
    # and never infers a kind from the test's prose: the old keyword guess
    # called `rel_err < 0.03` analytical, and the row it labelled is the hook
    # test against the paper's Table 14. A group declares this only when all
    # its comparisons share the kind; a mixed group declares none, and then
    # `check` fails until each comparison is decided by hand.
    reference_kind: paper
    source_files:
      - tests/validation/benchmarks/test_ko2017_performance.py
    common_tolerance:
      kind: rtol
      value: 0.05
      source: >-
        `rtol=0.05` through `assert_relative_error` (3.1-3.4, 3.6-3.9). Case
        3.5 uses `tol=0.01` per case and 3.6 a literal `rel_err < 0.03`, both
        stated per row.
      justified: true
      justification: >-
        The 5% bound is the suite rule (CONTRIBUTING test rule 1); the
        per-case values in 3.5 and 3.6 are tighter and stated in the code.
    headline: >-
      31 benchmark cases; worst 2.73% (Scordelis-Lo regular), tolerance 5%;
      most under 1%
    provenance_note: >-
      Every case prints `Norm vs Kirchhoff: <value> (expected: <cell>,
      error: <x>%)`. The measured margin is the value printed at `e879eba`
      and reproduced digit for digit at `34e2328`. Hardcoded
      `expected_normalized` values are the paper's MITC4/MITC4+ N=16 cells;
      the cells taken from the wrong table were corrected at `2fd847d`. A stale
      row here manufactures a false defect: the first version recorded an 8.5%
      deviation on the thin twisted beam that no longer exists.

  - id: "4"
    title: >-
      `tests/validation/parity/test_orthotropic_shell_parity.py` (orthotropic
      cantilever against CCX)
    slug: orthotropic_shell_parity
    # No reference_kind: the three comparisons in this file are against three
    # different things, so they are declared one by one. Policy rule 7.
    source_files:
      - tests/validation/parity/test_orthotropic_shell_parity.py
    common_tolerance:
      kind: rtol
      value: 0.05
      source: >-
        `assert rel_error < 0.05` in each test. The module states that in-plane
        lateral bending exposes a known MITC4 bilinear membrane limitation
        (~25-30% under-estimation of lateral flexibility against quadratic S8R),
        so its 5% bound is that suite rule and not a tightened one.
      justified: true
      justification: >-
        The 5% bound is the suite rule (CONTRIBUTING test rule 1). The module's
        own note is what makes it defensible rather than convenient: a wider gap
        is expected in the bending case and is documented here, not hidden in a
        loosened tolerance.
    provenance_note: >-
      The reference is CalculiX 2.23, read from the binary (`ccx -v` prints
      "This is Version 2.23") and not from memory: CCX's linear S4 does not
      support `*SHELL SECTION, COMPOSITE`, so the comparison runs on quadratic
      S8R. The version is part of the reference because it moves the numbers --
      the 2.20-to-2.23 shift took a high-mode gap from 4.03% to 2.12%
      (issue #8).

  - id: "5"
    title: >-
      `tests/validation/parity/test_blade_iea15mw_mesh_convergence.py`
      (IEA-15MW blade modal gap against CCX)
    slug: blade_mesh_convergence
    # Both comparisons are the same kind, and the file says so itself: the
    # docstring calls them "the AeroElast-vs-CCX modal gap" and the fixture
    # solves the blade through CalculiX. The convergence assert inside the
    # loop is not a comparison site: it compares our medium mesh with our
    # coarse one.
    reference_kind: code
    source_files:
      - tests/validation/parity/test_blade_iea15mw_mesh_convergence.py
    provenance_note: >-
      The reference is CalculiX 2.23, read from the binary. This is the test
      `docs/validation-environment.md` singles out as version-sensitive:
      under CCX 2.23 the high-mode worst gap is 2.12%, and issue #8 measured
      4.03% under CCX 2.20. That is why the version is part of the reference
      and is recorded here beside the numbers.

  - id: "6"
    title: >-
      `tests/validation/parity/test_thin_walled_tube_torsion.py`
      (thin-walled tube torsion against Bredt)
    slug: tube_torsion
    # Every comparison is against the same closed form, Bredt's T L / GJ.
    reference_kind: analytical
    source_files:
      - tests/validation/parity/test_thin_walled_tube_torsion.py
    # Nothing is declared here about what is not a comparison inside the solver
    # helper: that helper is no longer followed, and the comparison against
    # Bredt is written in each test body through the suite's assertion helper
    # with the reference named, which is what the extractor reads. See
    # docs/adding-validation-tests.md.
    #
    # The one declaration left is transitional and it is the last thing the
    # criterion has not caught up with: the extractor still counts a bare
    # assertion in a *test body* as a comparison, so the wall-traction test --
    # three load rulers and a symmetry, no reference -- would get a row and,
    # with the group's kind, a false one. It goes away when the criterion reads
    # the assertion helper instead of a literal bound.
    non_validation_tests:
      - tests:
          - test_wall_traction_excites_a_section_distortion
        reason: >-
          Every assertion in it is machinery: the torque ruler twice and the two
          walls of our own model agreeing. Waiting for the criterion switch, not
          a claim that it compares nothing.
    provenance_note: >-
      The reference is Bredt's closed form for a closed thin-walled tube, which
      this module had already validated before the production load path was
      exercised against it. Where the production realisation differs from
      Bredt, the difference is recorded in `gaps.yaml` as
      `moment_realization_over_delivers` rather than here: a row records what
      agrees.

  - id: "7"
    title: >-
      `tests/validation/parity/test_shell_stress_ccx_parity.py`
      (outer-fibre stress against CCX and against the closed form)
    slug: shell_stress_ccx
    # No reference_kind: the two comparisons that remain are against different
    # things -- CalculiX's 3D result and the beam-theory value -- so each one
    # declares its own. Policy rule 7.
    source_files:
      - tests/validation/parity/test_shell_stress_ccx_parity.py
    non_validation_tests:
      - tests:
          - test_outer_fibre_stress_is_symmetric
        reason: >-
          Its only assertion is that the two outer fibres of our own stress
          field carry the same magnitude. That is a property of our own model
          against itself, not a comparison against an independent reference, so
          policy rule 6 leaves it no row.
      - tests:
          - test_bending_has_no_membrane_stress
        reason: >-
          The mid-surface stress is asserted to be negligible against the outer
          fibre: again our own field against our own field, a property of the
          solution rather than a comparison against anything independent. The
          extractor finds no site in it because the bound is
          `0.02 * plate_stress["upper"]` and not a literal.
    provenance_note: >-
      The row compares the outer-fibre von Mises stress against two references
      at once: the CalculiX 2.23 result, read from the binary, and the
      beam-theory value. The file asserts the two legs separately, which is why
      the two comparisons carry different kinds.

  - id: "8"
    title: >-
      `tests/validation/parity/test_isotropic_shell_parity.py`
      (isotropic shell cantilever against CCX S4)
    slug: isotropic_shell
    # No reference_kind: the comparison states its own kind and its
    # reference, so the group declares neither.
    # See docs/adding-validation-tests.md.
    source_files:
      - tests/validation/parity/test_isotropic_shell_parity.py
    provenance_note: >-
      The reference is CalculiX 2.23, read from the binary, run as S4 on the
      same cantilever the AeroElast MITC4 model uses. The file's own note is
      kept beside the comparison: a comment there used to say "Allow 10%" over
      an enforced 5%, and the enforced value is the one that ran.

  - id: "9"
    title: >-
      `tests/validation/parity/test_ccx_shell_element_types_parity.py`
      (CalculiX element types against the closed form)
    slug: ccx_element_types
    # No reference_kind: every comparison states its own. See
    # docs/adding-validation-tests.md.
    source_files:
      - tests/validation/parity/test_ccx_shell_element_types_parity.py
    # Transitional, and the last mile of the criterion: the extractor still
    # counts a bare assertion against a literal as a comparison, and this test
    # asserts that three CalculiX element families agree with each other. That
    # is a property of the reference, not a comparison against an independent
    # one, so rule 6 leaves it no row. It goes away when the criterion reads
    # the assertion helper.
    non_validation_tests:
      - tests:
          - test_ccx_element_types_agree_with_each_other
        reason: >-
          It compares three CalculiX element families with each other. The
          reference is qualified against itself, which is a property of the
          reference rather than a comparison against an independent one.
    provenance_note: >-
      The reference is the Euler-Bernoulli closed form for the in-plane
      bending strip, so the three parametrised comparisons are each against a
      formula and not against another code. The module prints each element's
      error against that formula in the agreement test and never asserts it
      there: the store records those as unasserted, which is what they are.

  - id: "11"
    title: >-
      `tests/validation/bem/test_bem_openfast_parity.py`
      (AeroElast BEM against OpenFAST AeroDyn)
    slug: openfast_parity
    source_files:
      - tests/validation/bem/test_bem_openfast_parity.py
    # One test characterises a difference rather than validating an agreement:
    # the NeuralFoil-generated polar is asserted to differ from the official
    # table, which documents a known divergence and claims nothing. Another
    # checks the shape of the reference data -- 50 stations, 50 airfoils, 200
    # angles -- which is a property of the deck, not a comparison.
    non_validation_tests:
      - tests:
          - test_neuralfoil_generated_polar_differs_from_official
        reason: >-
          It asserts that a generated polar differs from the official
          table. That documents a divergence; it is not a measurement of ours
          against a reference, and the store records no row for it.
      - tests:
          - test_reference_polars_are_the_official_aerodyn_tables
        reason: >-
          It checks the shape of the reference data itself: 50 span stations, 50
          airfoils and 200 angles of attack. That is a property of the deck we
          loaded, not a comparison against an independent reference.
    provenance_note: >-
      Both codes get the same blade geometry and the same airfoil polar tables,
      so the comparison isolates the BEM implementation rather than the input
      data. OpenFAST is not installed in the development environment, so these
      tests skip here rather than fail; their rows are derived from the code
      and carry no measurement.

  - id: "12"
    title: >-
      `tests/validation/element/test_stress_stiffened_solver.py`
      (the recovered stress against the plane-stress closed form)
    slug: stress_stiffened
    source_files:
      - tests/validation/element/test_stress_stiffened_solver.py
    provenance_note: >-
      One test in this file compares against an independent reference: the
      recovered element stresses against the plane-stress closed form,
      sigma_xx = E/(1-nu^2)*eps and sigma_yy = nu*sigma_xx, with the shear
      that must vanish. The rest verify the components of the
      geometric-stiffness pipeline -- assembly, symmetry, positive
      semi-definiteness, the update interval -- which is why they are not
      rows.

  - id: "13"
    title: >-
      `tests/validation/benchmarks/test_mitc3_smoothed.py`
      (strain-smoothed MITC3+ against Lee & Lee 2019, Table 6)
    slug: mitc3_smoothed
    # The comparisons state their own kind; the citation is the group's, because
    # a paper reference has to resolve in the bibliography.
    citation: lee2019
    source_files:
      - tests/validation/benchmarks/test_mitc3_smoothed.py
    # Two assertions are not comparisons against the paper, and declaring the
    # whole test would lose the two that are. The lines are the ones the
    # extractor reported, not ones written from memory.
    non_reference_asserts:
      - at: "tests/validation/benchmarks/test_mitc3_smoothed.py:119"
        reason: >-
          The assembled stiffness matrix against its own transpose: a
          symmetry of our own matrix, not an independent reference.
      - at: "tests/validation/benchmarks/test_mitc3_smoothed.py:153"
        reason: >-
          A threshold that keeps the comparison beside it from being
          vacuous -- the plain element must show the locking at all --
          rather than a measurement of ours against the paper.
    provenance_note: >-
      The reference is Table 6 Mesh I of the paper, the normalized vertical
      displacement at point B of the Scordelis-Lo roof. The file re-reads the
      plain MITC3+ column of the same table so that the smoothed and the plain
      cells are compared the same way, which is what keeps the improvement claim
      from being vacuous.

  - id: "10"
    title: >-
      Evidence that exists outside `tests/`, and is not covered by a live test
    slug: outofband
    citation: ko2017_perf
    reference_kind: paper
    source_files: []
    headline: >-
      The triangular MITC3+ path, which no live test exercises: N=32 reproduces
      the published Table 10 cell digit for digit
    provenance_note: >-
      These rows are driven by hand, through the module's own machinery, because
      the live test of the same benchmark only exercises the quad path. They are
      not covered by the suite, so `regression` cannot re-measure them; their
      `measured` values are the ones recorded when the matrix existed, and the
      reproduction command is in the row's notes.

# There is no drift bucket any more. The directory is the classification: a
# test under `tests/validation/` validates a physical quantity against an
# independent reference and needs a group and a row; a test under
# `tests/software/` validates the software and needs neither. `check`
# refuses a row that claims a test from `tests/software/`, so the two cannot
# drift apart inside the store.
