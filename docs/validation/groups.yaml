      assertions.

  - id: "17"
    title: >-
      `tests/validation/parity/test_beam_shell_4cases_parity.py`
      (MITC4 against CalculiX S4, and against the closed form)
    slug: beam_shell_4cases
    source_files:
      - tests/validation/parity/test_beam_shell_4cases_parity.py
    # One test asserts nothing and is not a row: its subject is the CCX parity
    # of the four static cases, which it prints, and the print is the record. It
    # is reported as a test with no comparison, which is what it is.
    provenance_note: >-
      The four static cases are compared against an analytical solution and
      checked against CCX in two different tests; only the first asserts, so
