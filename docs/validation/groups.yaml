  - id: "20"
    title: >-
      `tests/validation/blade/test_blade_twist_anchor_beam.py`
      (the 1D anchor beam against the official deck)
    slug: blade_anchor_beam
    source_files:
      - tests/validation/blade/test_blade_twist_anchor_beam.py

    provenance_note: >-
      The independent 1D beam takes its GJ and shear centre from the official
      IEA-15-240-RWT BeamDyn deck and its loads from the production BEM, so
      the two models share loads and not section properties. The file also
