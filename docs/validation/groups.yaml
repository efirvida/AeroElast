  - id: "31"
    title: >-
      `tests/validation/parity/test_thin_walled_tube_moment_realization.py`
      (the production nodal moment realisation against Bredt's rate)
    slug: tube_moment_realization
    source_files:
      - tests/validation/parity/test_thin_walled_tube_moment_realization.py

    provenance_note: >-
      The reference is Bredt's T/GJ twist rate of the same closed tube, the
      closed form group 6 validates. This file is its own group because
      `extract --write` derives one group from one scope: declaring it as a
      second source of group 6 would regenerate that group's row file from a
      single scope and drop the three rows already measured there. Only the
      shear-flow case compares against the reference. The production
      minimum-norm case asserts that it MISSES Bredt, which documents an open
      defect instead of validating a bound, so that assertion stays bare and
      the defect is recorded in gaps.yaml,
      moment_realization_over_delivers. T3 of issue #30 executed it:
      `test_minimum_norm_realisation_over_delivers_bredt_by_the_recorded_factor`
      pins the over-delivery at 31.69331x self-equilibrated and 10.40654x
      clamped (1e-3 relative) without becoming a store comparison, because
      Bredt is the reference the field misses rather than one it must meet.
      T5 of the same issue named the coverage limit of the bound above: it is
      an **end-couple** measurement, while `project()` applies the shear flow
      ring by ring with `_ring_tributary_weights`, so the internal torque ramps
      and a self-equilibrated couple sits at every ring - the mode a campaign
      runs.  test_production_distributed_application_is_bredt_to_a_converging_residual
      pins that mode with the estimator-free energy balance
      `W / integral M_cum^2/(2 GJ)`: +4.356 % at dz = 0.2 m and +2.484 % at
      dz = 0.1 m (a discrete per-ring application residual that converges to
      Bredt with refinement), against +338 % for the parked minimum-norm field
      in the same mode, which does not move under refinement. Neither number is
      registered as a bound either: at a fixed mesh the local
      `theta'(z)*GJ/M_cum(z)` and the energy metric disagree.

  - id: "32"
    title: >-
      `tests/validation/blade/test_iea15mw_v02_natural_frequencies.py`
      (the IEA 15 MW blade's natural frequencies against the definition report)
    slug: blade_v02_natural_frequencies
    # [R1] is NREL/TP-5000-75698, which resolves in the bibliography as
    # gaertner2020. The ElastoDyn blade deck [R4] carries the same frequencies,
    # but one comparison states one reference: the report is the one it names.
    citation: gaertner2020
    source_files:
      - tests/validation/blade/test_iea15mw_v02_natural_frequencies.py
    # The two tolerances differ -- 5% for the flap modes and 10% for the 1st
    # edgewise -- so the group declares no common one and each comparison
    # carries its own.
    provenance_note: >-
      The blade alone, clamped at the root, no rotation and no aerodynamics,
      through the Rust assembler and the SLEPc modal solver over the official
      WindIO blade. Two comparisons become rows: the 1st flapwise against
      Table 5-2 of NREL/TP-5000-75698 within the suite's 5%, and the 1st
      edgewise within 10%, which the test justifies from the published
      inter-method dispersion of that same mode: six independent models in
      Zhou et al. 2025 (Energy 336:138488, Table 3) span 0.547-0.692 Hz for the
      mode against the 0.6406 Hz reference, i.e. -14.6% to +8.0%, rather than
      from what the shell happens to produce. Adjudicated in
      adjudications/32-blade_v02_natural_frequencies.yaml. The 2nd flapwise is
      NOT a row: at converged resolution the shell lands about 6% below the beam
      value (1.4866 / 1.5452 / 1.5539 Hz at element_size 1.00 / 0.50 / 0.25
      against 1.659 Hz) and the increments collapse, so the test carries a
      shell-versus-beam validity limit as its own xfail instead of asserting a
      bound it cannot meet.

  - id: "33"
    title: >-
      `tests/validation/element/test_static_nonlinear_ul_elastica.py`
      (the updated-Lagrangian shell against the exact elastica)
    slug: ul_elastica
    citation: bathe1979
    source_files:
      - tests/validation/element/test_static_nonlinear_ul_elastica.py
    provenance_note: >-
      A cantilever shell strip (L = 1 m, b = 0.1 m, h = 1e-3, steel) under a
      dead tip load, through StaticNonlinearSolver's updated-Lagrangian path,
      against the exact large-deflection elastica: Bisshopp & Drucker 1945,
      tabulated via Bathe & Bolourchi 1979. Two load levels,
      `alpha = P L^2 / EI` of 1.0 and 2.0. The `alpha = 1` comparison lands as
      an xfail carrying its measured number: refining the load stepping does
      not converge to the elastica, it converges about 4% below it (3.63 / 3.83
      / 3.92 / 3.97 / 4.00% at 32 / 64 / 128 / 256 / 512 steps), which is an
      element accuracy question about the UL path and not a stepping error, so
      the bound is not widened. Ported on 2026-10-07 off the deleted
      `test_shell_comprehensive` helpers, which is why the file moved into the
      validation tree from the repository root; the recorded steps=32 reading,
      `w/L = 0.29075`, reproduces exactly.

  - id: "34"
    title: >-
      `tests/validation/blade/test_iea15mw_s7_torsion.py`
      (the shell's global torsional response against the BeamDyn blade deck)
    slug: blade_s7_torsion
    # One comparison, one reference: the BeamDyn blade deck of the official IEA
    # 15 MW model. It is a code's tables, not a closed form and not a paper, so
    # the kind is declared here instead of left to a keyword guess.
    reference_kind: code
    source_files:
      - tests/validation/blade/test_iea15mw_s7_torsion.py
    non_validation_tests:
      - tests:
          - test_s7_applied_moment_matches_request
        reason: >-
          The applied tip couple is compared against the torque the test itself
          asked for, which is its own setup constant and not an independent
          reference. The test documents that the force-couple construction
          transmits the requested moment, so it is machinery and carries no row;
          the extractor already reads it as `no_comparison`. The torsional
          response is the other test in the file, and that one compares against
          the BeamDyn deck.
    provenance_note: >-
      The shell blade, clamped at the root, under a tip torsional moment of
      1000 N.m applied as transverse force couples, against the BeamDyn blade
      deck's `K[5,5]` per station integrated as a Timoshenko torsion beam
      (`theta(z) = M * integral dz/GJ(z)`). The section rotation is recovered
      from the displacement field as a best-fit rigid rotation, the same
      construction as S-1. The comparison is the station-by-station twist ratio
      over the 0.3-0.9 span band, and the bound is a +-30% window around exact
      agreement: the documented S-1 model difference with room for the
      coarse-mesh envelope, not a fit to what the run produces. The measured
      6.04% clears it by 24 points. `ELEMENT_SIZE = 0.25` is the fixture and it
      is justified by measurement (0.933641 at 0.125, 0.64% above it, at 12 GB
      peak RSS), not by the table the file used to carry.

      That table is why this group is new on 2026-10-07. Between 2026-09-30 and
      2026-10-04 the module committed a convergence record reading 1.386 / 1.406
      / 1.303 / 1.286 / 1.273, i.e. the shell *softer* than the deck, while its
      own assertion measured it stiffer. The table does not reproduce at HEAD at
      any mesh size, with or without the element-winding canonicalisation that
      `22d3ccc` removed, and the four independent sources that agree on the
      direction (this test, S-1's sectional `GJ`, `docs/model_parity_audit.md`,
      and the pre-merge closure's `GJ = 1.080`) all put the shell on the stiffer
      side. The table was replaced with rows measured at HEAD and the direction
      is now stated once. Evidence: issue #20, `odd/tasks/s7-torsion-ratio.md`,
      and `docs/validation_closures.md` section S-7 (2026-10-07).

  - id: "35"
    title: >-
      `tests/validation/parity/test_thin_walled_tube_projection.py`
      (the tube's rated load pattern through the production `ForceProjector`)
    slug: tube_projection
    source_files:
      - tests/validation/parity/test_thin_walled_tube_projection.py

    provenance_note: >-
      This file is its own group for the same reason as group 31: `extract
      --write` derives one group from one scope, so adding it as a second
      source of group 6 would regenerate that group's row file and drop its
      measured rows. It drives the **production** load path -
      `ForceProjector.project()` on a `MeshModel` built from the same closed
      rectangular tube, with the same Bredt `GJ`, mesh, solvers and `theta_z`
      metric the tube module already pins - where group 6's pattern test wrote
      its own traction in the test and group 31 drives `realise_section_load`
      directly. Two comparators are asserted per wall: the continuum closed
      form `e f L^2 / (2 GJ)` group 6 uses, which the production path clears by
      ~3.1% only because `ForceProjector` extends the outer strip bands half a
      spacing past the stations (`sum_k dr_k = L + DZ`, so the projected load's
      own torque ruler reads `e f (L + DZ)`), and the exact discrete
      Saint-Venant response to that same station load, which isolates the
      pattern and measures 0.22% / 0.09%. The force-conservation, torque-ruler,
      twist-sign and through-the-centre control assertions are load identities
      and physics properties, not comparisons against a reference, so they are
      no rows. Evidence: `odd/tasks/production-path-and-independent-arbiters.md`
      (Work units - P1a).

  - id: "36"
    title: >-
      `tests/validation/parity/test_composite_ply_stress_parity.py` and
      `tests/validation/parity/test_composite_stress_ccx_parity.py`
      (outer-fibre ply stress against CLT and against CalculiX S8R)
    slug: composite_ply_stress
    # No reference_kind: the comparisons are against two different things --
    # the CLT closed form and CalculiX's S8R outer-fibre value -- so each one
    # declares its own. Policy rule 7.
    source_files:
      - tests/validation/parity/test_composite_ply_stress_parity.py
      - tests/validation/parity/test_composite_stress_ccx_parity.py
    non_validation_tests:
      - tests:
          - test_reference_reproduces_published_clt_targets
        reason: >-
          Machinery, not a row: it pins the in-file CLT reference to the
          published 3.696 / 0.304 MPa targets and to the equilibrium mean
          `N_x / h`, so a transcription error in the reference cannot
          masquerade as a solver result. Our reference against itself, with
          no independent side.
      - tests:
          - test_top_is_not_the_thickness_mean
        reason: >-
          It asserts a property of our own field against our own field: the
          recovered TOP stress must not equal the thickness mean `N_x / h`
          the pre-T2 recovery returned. The form is that guard for both
          files, and `dev > 0.10` reads no independent reference.
      - tests:
          - test_production_and_test_section_forms_agree
        reason: >-
          A cross-check between two of our own section forms -- the
          `CompositeShellProperty` construction and the production Rust
          `Laminate` from `build_rust_properties` -- so both sides are ours.
          Policy rule 6 leaves it no row; it is the guard that the ply
          resolution is not a second implementation.
      - tests:
          - test_raw_abd_section_is_smeared_and_warns
        reason: >-
          A characterisation of a known limitation, not a validation: it pins
          that a raw homogenised ABD dict (no ply stack) keeps returning the
          thickness mean and emits one warning. The comparison is our smeared
          value against the equilibrium mean of the load we applied, i.e. our
          own field against itself. What the limitation costs is recorded in
          `gaps.yaml` id `composite_stress_recovery`.
      - tests:
          - test_bending_moment_is_station_independent
        reason: >-
          Pure-moment station independence: the centre and the 3/4-span
          stations of our own field are compared with each other. Our own
          result against our own result, so rule 6 leaves it no row.
      - tests:
          - test_bending_outer_fibres_are_opposite_and_per_ply
        reason: >-
          Sign, mid-surface negligibility and ply-index assertions: every one
          is a property of our own field or of the documented interface
          convention, with no independent reference on either side.
      - tests:
          - test_middle_tie_break_rule_is_pinned
        reason: >-
          It pins the half-open `[z_bottom, z_top)` interface rule by the
          resolved ply index, which is the one thing a value check cannot
          catch because both neighbouring plies are 90 deg. The interface
          convention is ours, so the test is machinery rather than a
          comparison against an independent reference, even though one of its
          assertions reads a CLT value.
      - tests:
          - test_free_field_is_mesh_stable_but_the_global_max_is_not
        reason: >-
          A mesh-stability guard: both codes' free-field values are asserted
          not to move under refinement and the CalculiX global maximum to
          grow. Properties of our own and CalculiX's fields under refinement,
          not a comparison against an independent reference value.
    provenance_note: >-
      This group covers the two files that close issue #27. The first is the
      CLT reference: symmetric `[0/90]s` and `[90/0]s` strips in membrane
      tension, pure bending of `[0/90]s`, and a balanced `[+45/-45]s` case
      that discriminates the per-ply `Qbar(theta)` through `sigma_xy`. The
      second is the converged-vs-converged comparison against CalculiX 2.20
      S8R with `*SHELL SECTION, COMPOSITE`, read at the free-field centre and
      not at the global maximum, with the CLT value as the second reference.
      `TOL_CCX = 0.05` is a bound and not a convergence claim: at 16x4 ours is
      3.6959 / 0.3041 MPa against CalculiX 3.6853 / 0.3148 MPa, i.e. 0.29% /
      3.41%; the `[90/0]s` gap barely moves with refinement (3.48% -> 3.41%)
      and the whole of it sits on the CalculiX side. The CalculiX composite
      FRD value is the expanded outer-fibre node (its midsurface node is
      exactly 0), and the global maximum is a load-introduction singularity
      at the loaded free edge (5.8838 -> 6.5803 MPa with refinement), which
      the row deliberately does not read. Evidence:
      `odd/tasks/composite-ply-stress-recovery.md` (T1-T4) and issue #27.

  - id: '37'
    title: >-
      `tests/validation/bem/test_wall_flow_activation.py` (the production
      coupling mesh keeps its skin elements and the deck's section properties,
      so the wall-flow moment realisation runs instead of falling back)
    slug: wall_flow_activation
    source_files:
      - tests/validation/bem/test_wall_flow_activation.py
    non_validation_tests:
      - tests:
          - test_coupling_node_set_filter_keeps_the_node_list_and_the_skin_elements
        reason: >-
          A structural guard on the coupling-mesh filter: the node list, its
          order, the node ids and the element-set membership must be exactly
          the node set's plus the fully contained elements. No physical
          quantity and no reference; the physical comparison for the
          realisation itself is group 31 against Bredt.
      - tests:
          - test_production_coupling_mesh_realises_a_ring_section
        reason: >-
          The enablement count of the activation: with the deck's section
          properties the production projector precomputes realisable ring
          sections (185 of 185 at the coarse test mesh, 671 of 671 at the
          campaign's `element_size: 0.25`) where the node-only coupling mesh
          gave none. A count of our own precomputation, not a measured
          physical quantity against a reference value.
      - tests:
          - test_factory_participant_realises_every_precomputed_ring
        reason: >-
          The same enablement through the production factory
          (`build_from_config` -> `BEMFSIParticipant` -> `ForceProjector`):
          every precomputed ring resolves its walls from the deck's laminates.
          A wiring guard with no external reference.
      - tests:
          - test_aero_dispatcher_activates_the_realisation_on_the_campaign_path
        reason: >-
          The campaign entry point guard: `aeroelast` -> `run_aero_fsi` ->
          backend dispatch -> legacy `BEMFSIParticipant` must carry the same
          map. It exists because the coupled A/B stayed identical to ten digits
          until that hop was added. A wiring guard with no external reference.
      - tests:
          - test_wall_flow_leaves_the_applied_resultant_unchanged
        reason: >-
          A self-consistency guard between our own two realisations: the
          wall-flow split and the minimum-norm fallback must apply the same
          resultant (relative |dF| ~1e-16). There is no external reference for
          a distribution that carries an exact resultant; the bound is on our
          own two paths.
      - tests:
          - test_without_the_property_map_every_strip_falls_back
        reason: >-
          A regression guard: the property-less path must stay bit-identical
          to the pre-#16 node-only projector (`np.array_equal`). It pins that
          the activation is opt-in through the property map and does not move
          the fallback.
    provenance_note: >-
      This group is the activation guard of issue #16 (roadmap item P2 of
      #18): the production BEM coupling mesh is built by filtering the
      generated blade mesh to the `allOuterShellNods` node set, and the
      filter used to drop every element, so `ring_section` found no chordwise
      wall edge and every strip fell back to the minimum-norm `_distribute`
      field (0 of 671 ring sections usable at the campaign mesh). The filter
      now keeps the fully contained elements (`MeshModel.subset_to_nodes`) and
      the CLI hands the generator's own section-property map to the
      projector, so the wall-flow realisation runs. Measured on the campaign
      mesh: 27609 nodes with 27598 elements, 671 of 671 ring sections
      realisable from the deck's laminates, every one of them single-cell
      (the coupling set excludes the shear webs on purpose), 100 % property
      coverage of the coupling elements, and a resultant identical between
      the two realisations to machine precision while the distribution moves
      (relative L2 92 %). Evidence: `odd/tasks/bem-wall-flow-activation.md`,
      `docs/validation_closures.md` section "#16", and the gap entry
      `moment_realization_over_delivers` in `docs/validation/gaps.yaml`.

# There is no drift bucket any more. The directory is the classification: a
# test under `tests/validation/` validates a physical quantity against an
# independent reference and needs a group and a row; a test under
# `tests/software/` validates the software and needs neither. `check`
# refuses a row that claims a test from `tests/software/`, so the two cannot
# drift apart inside the store.
