  - id: "21"
    title: >-
      `tests/validation/blade/test_laminate_bend_twist_3d.py`
      (the 3D layer-wise solid judge for the bend-twist strip)
    slug: laminate_bend_twist_3d
    source_files:
      - tests/validation/blade/test_laminate_bend_twist_3d.py

    provenance_note: >-
      A hand-authored CalculiX deck, one C3D20R per ply, used as an independent
      judge of the shell for the strip's bend-twist behaviour. Its answer is a
      comparison between two of our own models -- the 3D solid against the
      shell, which rule 3 allows as a restrictive assertion -- and the rest of
