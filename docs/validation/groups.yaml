  - id: "18"
    title: >-
      `tests/validation/parity/test_composite_layup_parity.py`
      (composite layup parity against CalculiX S8R)
    slug: composite_layup
    source_files:
      - tests/validation/parity/test_composite_layup_parity.py

    provenance_note: >-
      Four layups through the same geometry and the same mesh in both codes, so
      the comparison isolates the composite material behaviour rather than the
      input data: axial extension, transverse bending, the asymmetric
      membrane-bending coupling, and the first five matched modal frequencies.
      Each comparison states its own kind and reference, so the group declares
