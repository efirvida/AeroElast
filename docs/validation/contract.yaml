  - target: newton_elastica.test_newton_scheme_narrow_strip_matches.1_0
    class: physics
    verdict: trusted
    audited_rev: c0fdeea
    arbiters:
      - {kind: published_numerical, label: "Bisshopp & Drucker (1945) elastica tabulated by Bathe & Bolourchi (1979)"}
      - {kind: analytical, label: "the elastica re-integrated by shooting on theta'' = -alpha cos(theta): w/L .30172 / .49346, u/L -.05643 / -.16064"}
    note: >-
      Measured at ec3c9f6: narrow strip b = 0.025, scheme newton, 64 x 2, tip w/L 0.358 % and u/L 0.622 %
      from the elastica against 1 % bounds. Mesh table (nx = 32 / 64 / 128, ny = 2): alpha 1 -0.52 / -0.36
      / -0.31 %, alpha 2 -0.61 / -0.39 / -0.33 %; ny = 4 agrees to 0.01 %. The elastica is a beam, so it
      is a valid arbiter only near the beam limit: the plate offset is -5.0 / -1.2 / -0.36 % at b = 0.1 /
      0.05 / 0.025 and at b = 0.00625 the solver reads w -0.11 % and u -0.18 % at alpha = 2. The result
      does not depend on the load stepping (4 against 16 steps agree to 1e-3, software test). The 1 %
      bound is about 2.5 times the measured error and under the 5 % ceiling.
