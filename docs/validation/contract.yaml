      MITC4 24.501 m against the beam 24.5254 m, 0.0997 % against a 1 % bound at 32/16/400 elements. The residual the repo carried as open since 2026-10 (1.07 % at 200 layers) was span discretisation: -4.75 / -1.07 / -0.35 / -0.10 % at 100 / 200 / 300 / 400 layers (SLURM 11614803); the earlier note called 200 converged after comparing only 100 and 200. Unresolved: CalculiX S8R converges to +1.90 % above the beam on the same tube, 2 points away from MITC4. Controls: a closed circular tube under distributed load gives CalculiX +0.40 % (the Timoshenko shear term accounts for about +0.5 %) and MITC4 -1.36 / +0.54 / -0.03 % at 32x100 / 32x200 / 64x200 (facetting and span, not converged), so the D-section +1.9 % of CalculiX is not explained by a calibration bias there; both codes are inside the 5 % ceiling, the 2 % spread is reported, not closed.
