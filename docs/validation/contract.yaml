    arbiters:
      - {kind: produced_numerical, label: "CalculiX S8R, the same mesh and composite properties (ccx 2.20 on this cluster)"}
      - {kind: reference_model, label: "OpenFAST v5.0.0 BeamDyn single member p20, official v1.1 deck, parked (0 rpm) MBC3 collective (SLURM 11617531/11617539; p15 -> p20 moves <= 0.25 %)"}
    note: >-
      L3 T13 audit (2026-10-27). Provenance read from the code: the CCX deck is written from the same `BladeMesh` and properties as
      the shell (ELEMENT_SIZE 0.25, mid-surface skin), quadratic S8R/S6 via `write_ccx_mesh(quadratic=True, span_direction=(0,0,1))`,
      root clamped; metric = |f_ae - f_ccx| / f_ccx after a one-to-one Hungarian pairing over 10 modes each. DEFECT FOUND and fixed: the
      helper returned the n smallest gaps, so row `.k` was the k-th best pair of 10, not CCX mode k+1 (a green-biased selection); rows
      now are CCX modes 1-5, so the 2026-10-24 values (0.01-0.12 %) are superseded. The binary is not 2.23: `ccx -v` of the
      only CCX on this cluster prints "Version 2.20" (the test did not read it; the label said 2.23); the run log now prints it.
      Second arbiter: BeamDyn p20 parked, expected family p20 1F (S-4 asserts it, group 40), valid only if the run shows shell mode 1
      is that family (PREDICTION.md; no local mode below it). Verdict after the run.
      RESULT 2026-10-28 (SLURM 11625842 es 0.25, regression --group 23 at 64976d8): mode 1 gap 0.0465 % vs CalculiX 2.20 on the same mesh (prediction <= 0.3 %, held); p20 parked gives the same mode family and order for modes 1-5. Trusted (K3). This is code parity (same discretisation), not a physics arbiter of the blade.
