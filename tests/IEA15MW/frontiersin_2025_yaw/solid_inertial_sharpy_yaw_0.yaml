mesh:
  source: generator
  generator:
    type: RotorMesh
    params:
      yaml_file: ../../IEA-15-240-RWT.yaml
      airfoil_dir: ../../airfoils
      element_size: 0.25
      n_samples: 300
      airfoil_spacing: constant
      span_grading: chord
      n_blades: 3
      hub_radius: 3.0
  renumber: rcm
  output_file: solid_mesh.vtu
elements:
  family: SHELL
  span_direction:
  - 0.0
  - 0.0
  - 1.0
solver:
  # SHARPy FSI case: full three-blade structural rotor to match the aerodynamic model.
  type: LinearDynamicFSIRotorInertial
  solver_type: direct
  newmark:
    beta: 0.25
    gamma: 0.5
  damping:
    enabled: true
    zeta: 0.03
    mode_i: 1
    mode_j: 2
    num_modes: 10
  rotor:
    omega: 0.7906341464750989
    omega_ramp_time: 0
    force_ramp_time: 0
    rotation_axis:
    - 0.0
    - 1.0
    - 0.0
    rotation_center:
    - 0.0
    - 0.0
    - 0.0
    gravity:
    - 0.0
    - 0.0
    - -9.81
    include_geometric_stiffness: true
    moment_of_inertia: null
    send_omega_to_precice: true
    send_velocity_to_precice: false
    kg_update_interval: 0
    kg_use_deformed_coords: false
    use_corotational_kt: false
    kt_coro_update_freq: 1
boundary_conditions:
  dirichlet:
  - nodeset: RootNodes_blade_1
    value: 0.0
  - nodeset: RootNodes_blade_2
    value: 0.0
  - nodeset: RootNodes_blade_3
    value: 0.0
coupling:
  participant: Solid
  config_file: ../precice-config.xml
  coupling_mesh: Solid-Mesh
  write_data: Displacement
  read_data: Force
  boundaries:
  - allOuterShellNods_blade_1
  - allOuterShellNods_blade_2
  - allOuterShellNods_blade_3
output:
  folder: inertial_sharpy
  write_interval: 0.5
  start_from: latestTime
  save_deformed_mesh: false
  deformed_mesh_scale: 1.0
performance:
  fluid_density: 1.225
  flow_velocity: 10.59