participant: Fluid
config_file: ../precice-config.xml
coupling_mesh: Fluid-Mesh
displacement_data: Displacement
velocity_data: null
blade_file: ../../IEA-15-240-RWT.yaml
mesh:
  source: generator
  generator:
    type: BladeMesh
    params:
      yaml_file: ../../IEA-15-240-RWT.yaml
      airfoil_dir: ../../airfoils
      element_size: 0.25
      n_samples: 300
      airfoil_spacing: constant
      span_grading: chord
    coupling_node_set: allOuterShellNods
  output_file: fluid_mesh.vtu
bem:
  # Ma et al. 2025 (doi:10.3389/fenrg.2025.1571567)
  # IEA-15MW rated condition, uniform inflow, yaw=0 deg (aligned)
  wind_speed: 10.59
  pitch: 0.0
  yaw: 0.0
  omega:
    initial: 0.7906341464750989
    mesh: GlobalFluidMesh
    data: AngularVelocity
    vertex:
    - 0.0
    - 0.0
    - 0.0
  air_density: 1.225
  dynamic_viscosity: 1.81e-05
  hub_height: 150.0
  shear_exp: 0.0
  n_blades: 3
  hub_radius: 0.0
  default_re: 1.0e7
  neuralfoil_model: large
  viterna_ar: 17.0
  viterna_confidence_threshold: 0.5
  precone: 0.0
  tilt: 0.0
  # The Rust rotor solver exchanges inertial-frame vectors (T7a).
  partner_frame: inertial
  rotation_axis:
  - 0.0
  - 1.0
  - 0.0
  span_direction:
  - 0.0
  - 0.0
  - 1.0
  normal_direction:
  - 0.0
  - 1.0
  - 0.0
  # T7b: positive Tp drives the rotor, so it points along the blade's motion, which is
  # toward the leading edge (+x on this mesh; omega x r = +x). Only change vs fluid_yaw_0.yaml.
  tangential_direction:
  - 1.0
  - 0.0
  - 0.0
output:
  folder: fluid
  log_interval: 1
  write_vtu: false
